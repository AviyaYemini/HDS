[project]
name = "hds-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # 0.121.0 is the first release whose Depends() accepts scope="function", which the
    # request-scoped transaction relies on (specs/002-security-hardening/research.md D1).
    "fastapi>=0.121.0",
    "pydantic[email]>=2",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2",
    "alembic>=1.13",
    "argon2-cffi>=23",
    "pyjwt>=2.8",
    "asyncpg>=0.29",
    "aiofiles>=23",
    "uvicorn[standard]>=0.29",
    # IANA time zone data for systems that ship none (site time zone validation, research D11).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "schemathesis>=4.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "interrogate>=1.7",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pyyaml>=6",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hds"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "D"]
# UP042/UP046: str+Enum and Generic[...] are kept deliberately (stable DB enum/JSON behaviour).
ignore = ["UP042", "UP046"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from missing-docstring rules (D1xx); the module docstring that cites
# requirement ids is checked in review (Constitution XI.5), not by pydocstyle.
"tests/**" = ["D1"]

[tool.ruff.format]
quote-style = "double"

[tool.interrogate]
# Constitution XI.9: 100% docstring coverage of src/. Public API only: private, magic and
# nested definitions and __init__ methods are exempt; modules (incl. __init__.py) are not.
fail-under = 100
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
ignore-nested-classes = true
exclude = ["tests"]
verbose = 1

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
