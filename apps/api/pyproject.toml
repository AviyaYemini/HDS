[project]
name = "hds-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2",
    "alembic>=1.13",
    "argon2-cffi>=23",
    "pyjwt>=2.8",
    "asyncpg>=0.29",
    "aiofiles>=23",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "schemathesis>=4.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pyyaml>=6",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hds"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
# UP042/UP046: str+Enum and Generic[...] are kept deliberately (stable DB enum/JSON behaviour).
ignore = ["UP042", "UP046"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
