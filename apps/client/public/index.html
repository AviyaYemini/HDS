<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>
    <!--
      HDS: the page's language and direction come from the address, the remembered choice or the
      browser, before any script runs, so the splash below already reads right to left in Hebrew
      (specs/007-ux-redesign FR-077). The app sets them again once it starts.
    -->
    <script>
      (function () {
        var allowed = ["he", "en"];
        var params = new URLSearchParams(location.search);
        var asked = params.get("lang");
        var stored = null;
        try { stored = localStorage.getItem("hds.language"); } catch (e) {}
        var device = (navigator.language || "en").slice(0, 2);
        var lang = allowed.indexOf(asked) >= 0 ? asked : allowed.indexOf(stored) >= 0 ? stored : allowed.indexOf(device) >= 0 ? device : "en";
        var root = document.documentElement;
        root.lang = lang;
        root.dir = lang === "he" ? "rtl" : "ltr";
        var theme = params.get("theme");
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (theme === "dark" || (theme !== "light" && dark)) root.setAttribute("data-splash-dark", "");
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- HDS: Option B's canvas and the static splash, shown until the app has started. -->
    <style id="hds-splash">
      body {
        margin: 0;
        background: #dde1dd;
        color: #151e1a;
        font-family: "IBM Plex Sans", "IBM Plex Sans Hebrew", system-ui, sans-serif;
      }
      html[data-splash-dark] body {
        background: #101413;
        color: #f5f3ed;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #dde1dd;
        z-index: 9999;
      }
      html[data-splash-dark] #splash {
        background: #101413;
      }
      #splash .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto;
        background: #d7a57e;
        clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
      }
      html[dir="rtl"] #splash .mark {
        clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
      }
      #splash .name {
        margin-top: 16px;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        font-weight: 500;
      }
      #splash .bar {
        margin: 24px auto 0;
        width: 120px;
        height: 3px;
        background: #d7a57e;
        position: relative;
        overflow: hidden;
      }
      #splash .bar::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        background: #834b30;
        animation: hds-sweep 1.2s cubic-bezier(0.2, 0, 0, 1) infinite;
      }
      @keyframes hds-sweep {
        from {
          left: -40%;
        }
        to {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .bar::after {
          animation: none;
          left: 30%;
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="splash" data-testid="splash" role="status" aria-label="HDS">
      <div>
        <div class="mark"></div>
        <div class="name">HDS</div>
        <div class="bar"></div>
      </div>
    </div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
