# One VaultStaticSecret per path (specs/006 T051, data-model.md "Secrets"): the operator copies the
# path's keys into the Secret as they are, checks again every refreshAfter, and restarts the
# Deployments named when they change.
#
# Kept on uninstall (helm.sh/resource-policy: keep): deleting a VaultStaticSecret makes the operator
# delete the Secret it made, and every pod would fail at its next start. Never uninstall this
# release; docs/runbooks/operations.md (section Vault) says how to remove it on purpose.
{{- range .Values.secrets }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "hds-secrets.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  vaultAuthRef: hds
  type: kv-v2
  mount: {{ $.Values.vault.mount | quote }}
  path: {{ .path | quote }}
  refreshAfter: {{ $.Values.vault.refreshAfter | quote }}
  destination:
    name: {{ .name }}
    create: true
  {{- with .restart }}
  rolloutRestartTargets:
    {{- range . }}
    - kind: Deployment
      name: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.registry.enabled }}
---
# The pull secret, built from hds/registry's token: a Secret of type dockerconfigjson with that one
# key; the raw keys are left out.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: hds-registry
  labels:
    {{- include "hds-secrets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  vaultAuthRef: hds
  type: kv-v2
  mount: {{ .Values.vault.mount | quote }}
  path: registry
  refreshAfter: {{ .Values.vault.refreshAfter | quote }}
  destination:
    name: hds-registry
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        .dockerconfigjson:
          text: {{ printf "{\"auths\":{%q:{\"auth\":\"{{ printf \"%s:%%s\" .Secrets.GHCR_READ_TOKEN | b64enc }}\"}}}" .Values.registry.server .Values.registry.username | quote }}
{{- end }}
