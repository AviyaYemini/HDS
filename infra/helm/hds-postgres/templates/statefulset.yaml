# One PostgreSQL instance on the official image (research R3). Non-root (the image's postgres user,
# uid 999) with a read-only root filesystem; the socket and temporary folders are emptyDirs. The
# probes go over TCP, as the image's first-start set-up server answers on the socket only (T032a).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hds-postgres.name" . }}
  labels:
    {{- include "hds-postgres.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "hds-postgres.name" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "hds-postgres.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hds-postgres.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          ports:
            - name: postgres
              containerPort: {{ .Values.database.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecret.name }}
                  key: {{ .Values.database.passwordSecret.key }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # The server listens on it, and pg_isready below uses it too.
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
          # initdb and the first-start set-up, or crash recovery, answer on the socket only and can
          # take minutes on a slow disk; liveness starts once this passes.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U {{ .Values.database.user }}"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U {{ .Values.database.user }}"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U {{ .Values.database.user }}"]
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
