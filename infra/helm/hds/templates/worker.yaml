# The schedule worker (research R5, FR-020): one pod, a new one started before the old stops. On
# SIGTERM it finishes its solve (up to 60 s) and stores it, or hands back a job not yet solving;
# terminationGracePeriodSeconds 90 must exceed the longest solve plus storing (hds.worker).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hds.name" . }}-worker
  labels:
    {{- include "hds.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "hds.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hds.labels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- include "hds.databaseClient" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "hds.name" . }}-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        {{- include "hds.podSecurity" (dict "uid" 10001) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "hds.image" (dict "root" . "part" "api") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "-m", "hds.worker"]
          ports:
            - name: ops
              containerPort: 9100
          env:
            {{- include "hds.apiEnv" (dict "root" . "service" "hds-worker") | nindent 12 }}
          {{- include "hds.apiEnvFrom" (dict "root" .) | nindent 10 }}
          # contracts/ops.md section 1; liveness counts a held job inside its lease (research R6).
          startupProbe:
            httpGet: {path: /livez, port: 9100}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /livez, port: 9100}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 9100}
            periodSeconds: 5
          securityContext:
            {{- include "hds.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "hds.apiMounts" (dict "root" .) | nindent 12 }}
      volumes:
        {{- include "hds.apiVolumes" (dict "root" .) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hds.name" . }}-worker
  labels:
    {{- include "hds.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  selector:
    {{- include "hds.selector" (dict "root" . "component" "worker") | nindent 4 }}
  ports:
    - name: ops
      port: 9100
      targetPort: ops
