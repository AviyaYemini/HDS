{{- if .Values.vault.snapshotRecipient }}
# Vault's weekly snapshot (research R11): taken through Vault's HTTP API, encrypted with age to the
# public key in the values, and written through the plain local: and offsite: remotes, not the
# crypt ones, whose password lives in Vault. It signs in to Vault with its own ServiceAccount's
# token (Vault's Kubernetes auth, Group J); the account has no Kubernetes permission at all.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "hds.name" . }}-vault-snapshot
  labels:
    {{- include "hds.labels" (dict "root" . "component" "vault-snapshot") | nindent 4 }}
spec:
  schedule: {{ .Values.vault.snapshotSchedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  startingDeadlineSeconds: 86400
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      # A Job made by hand (`make ops-backup`, `make ops-restore-test`) carries these too, so it is
      # found while it runs.
      labels:
        {{- include "hds.labels" (dict "root" . "component" "vault-snapshot") | nindent 8 }}
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "hds.labels" (dict "root" . "component" "vault-snapshot") | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "hds.name" . }}-vault-snapshot
          # The token is for Vault's sign-in only.
          automountServiceAccountToken: true
          securityContext:
            {{- include "hds.podSecurity" (dict "uid" 999) | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          containers:
            - name: vault-snapshot
              {{- include "hds.backupContainer" (dict "root" .) | nindent 14 }}
              command: ["vault-snapshot.sh"]
              env:
                {{- include "hds.backupEnv" (dict "root" .) | nindent 16 }}
                - name: VAULT_ADDR
                  value: {{ .Values.vault.address | quote }}
                - name: HDS_VAULT_ROLE
                  value: {{ .Values.vault.role | quote }}
                - name: HDS_VAULT_RECIPIENT
                  value: {{ .Values.vault.snapshotRecipient | quote }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "hds.name" . }}-backups
            - name: tmp
              emptyDir: {}
{{- end }}
