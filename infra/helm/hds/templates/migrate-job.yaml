# The migrations (FR-016, research R5): a hook before install and before every upgrade, so the
# database is at the new code's head before any new pod starts; if it fails, the upgrade stops and
# no pod changes. hds.scripts.migrate holds an advisory lock, so two never run together, and leaves
# a newer database alone (a rollback). It runs on the API image, and is a hook so it cannot use the
# chart's own objects (the ServiceAccounts): it has no token at all.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hds.name" . }}-migrate
  labels:
    {{- include "hds.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "hds.labels" (dict "root" . "component" "migrate") | nindent 8 }}
        {{- include "hds.databaseClient" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "hds.podSecurity" (dict "uid" 10001) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "hds.image" (dict "root" . "part" "api") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "-m", "hds.scripts.migrate"]
          env:
            {{- include "hds.apiEnv" (dict "root" . "service" "hds-migrate") | nindent 12 }}
          {{- include "hds.apiEnvFrom" (dict "root" .) | nindent 10 }}
          securityContext:
            {{- include "hds.containerSecurity" . | nindent 12 }}
          volumeMounts:
            {{- include "hds.apiMounts" (dict "root" .) | nindent 12 }}
      volumes:
        {{- include "hds.apiVolumes" (dict "root" .) | nindent 8 }}
