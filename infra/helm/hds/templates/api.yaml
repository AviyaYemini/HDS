# The API (research R5): two pods, a new one serving before an old one stops (maxUnavailable 0),
# traffic only once /readyz passes, and a 5 s pause before stopping so the ingress drops the pod
# first; uvicorn then finishes its open requests inside the 30 s grace (FR-017).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hds.name" . }}-api
  labels:
    {{- include "hds.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "hds.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hds.labels" (dict "root" . "component" "api") | nindent 8 }}
        {{- include "hds.databaseClient" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "hds.name" . }}-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "hds.podSecurity" (dict "uid" 10001) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "hds.image" (dict "root" . "part" "api") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
            - name: ops
              containerPort: 9100
          env:
            {{- include "hds.apiEnv" (dict "root" . "service" "hds-api") | nindent 12 }}
          {{- include "hds.apiEnvFrom" (dict "root" .) | nindent 10 }}
          # contracts/ops.md section 1.
          startupProbe:
            httpGet: {path: /livez, port: 8000}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /livez, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            {{- include "hds.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "hds.apiMounts" (dict "root" .) | nindent 12 }}
      volumes:
        {{- include "hds.apiVolumes" (dict "root" .) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hds.name" . }}-api
  labels:
    {{- include "hds.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "hds.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
    # Scraped inside the cluster only; the ingress never routes it (FR-009).
    - name: ops
      port: 9100
      targetPort: ops
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hds.name" . }}-api
  labels:
    {{- include "hds.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "hds.selector" (dict "root" . "component" "api") | nindent 6 }}
