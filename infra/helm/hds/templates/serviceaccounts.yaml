# One ServiceAccount per part, with no token mounted: none of them calls the Kubernetes API. The
# backup jobs share hds-backup. hds-vault-snapshot has no Role at all: its token is only shown to
# Vault, whose Kubernetes auth role (Group J) is bound to this account.
{{- range $part := list "api" "worker" "web" "backup" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hds.name" $ }}-{{ $part }}
  labels:
    {{- include "hds.labels" (dict "root" $ "component" $part) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.vault.snapshotRecipient }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hds.name" . }}-vault-snapshot
  labels:
    {{- include "hds.labels" (dict "root" . "component" "vault-snapshot") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
