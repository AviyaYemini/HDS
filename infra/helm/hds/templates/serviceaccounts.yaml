# One ServiceAccount per part, with no token mounted: none of them calls the Kubernetes API.
{{- range $part := list "api" "worker" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hds.name" $ }}-{{ $part }}
  labels:
    {{- include "hds.labels" (dict "root" $ "component" $part) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
