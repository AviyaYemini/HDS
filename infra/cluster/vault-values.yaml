# Vault in the shared environment (specs/006-deploy-operations T052, research R13), for the pinned
# hashicorp/vault chart (infra/VERSIONS.md): one node, integrated storage (raft) on a PVC, no
# injector (the Vault Secrets Operator syncs Secrets instead) and no UI. Installed into the
# namespace vault by `make ops-cluster` (T063); initialised and unsealed by hand
# (docs/runbooks/operations.md, section Vault).
global:
  # The listener is plain HTTP inside the cluster; the NetworkPolicy below limits who reaches it.
  tlsDisable: true
injector:
  enabled: false
ui:
  enabled: false
server:
  image:
    repository: hashicorp/vault
    tag: "2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2"
  dataStorage:
    enabled: true
    size: 1Gi
  ha:
    # The chart runs raft only in its HA mode; one replica is one node.
    enabled: true
    replicas: 1
    # One node keeps no quorum through a disruption anyway; the chart's budget for one replica is
    # maxUnavailable 0, which would block every node drain (review R151).
    disruptionBudget:
      enabled: false
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false
        disable_mlock = true
        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}
  # Who may reach Vault's API (Proposed; review R137): the Vault Secrets Operator's namespace, and
  # the snapshot job's pods in hds. The operator's `kubectl port-forward` and `kubectl exec` reach
  # the pod through the kubelet, not the pod network, so this does not limit them.
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: vault-secrets-operator
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: hds
            podSelector:
              matchLabels:
                app.kubernetes.io/component: vault-snapshot
        ports:
          - port: 8200
            protocol: TCP
