# Serves the Expo web export (infra/Dockerfile.web). The image runs nginx as a non-root user, so it
# listens on 8080, not 80.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The app routes in the browser: any path that is not a file gets the app, which reads the URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles never change under one name, so they may be cached for a year; the page itself
    # is always fetched afresh, so a new release is picked up on the next load.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    server_tokens off;
}
