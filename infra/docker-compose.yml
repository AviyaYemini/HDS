services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hds}
      POSTGRES_USER: ${POSTGRES_USER:-hds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hds_dev}
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hds}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Stated, never defaulted: the settings refuse to start without an explicit environment.
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hds}:${POSTGRES_PASSWORD:-hds_dev}@postgres:5432/${POSTGRES_DB:-hds}
      # No default on purpose: compose stops when this is unset or empty, so the stack can never
      # run with a signing key that is published in this repository.
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?set JWT_SECRET_KEY, generate one with: openssl rand -hex 32}"
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api/src:/app/src
