# The hds-secrets release (specs/006 T052, research R3 amended in Group J): the Vault Secrets
# Operator's objects, which keep the Secrets hds-postgres and hds read. Installed first; hds-postgres
# waits for it. Never uninstall it: its VaultStaticSecrets are kept by Helm, and deleting them
# deletes the Secrets (docs/runbooks/operations.md, section Vault).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hds-secrets
spec:
  interval: 10m
  releaseName: hds-secrets
  targetNamespace: hds
  storageNamespace: hds
  chartRef:
    kind: OCIRepository
    name: hds-secrets
  timeout: 5m
  maxHistory: 10
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
