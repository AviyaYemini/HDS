# Local hooks, installed with `make hooks` (pre-commit 4.7.0). CI is the authority; these catch the
# same faults before a commit. ruff and mypy run the project's own versions through uv, from
# apps/api's lockfile, so a hook can never disagree with CI over a tool's version.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check (apps/api)
        entry: sh -c 'cd apps/api && uv run --extra dev ruff check src tests'
        language: system
        files: ^apps/api/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check (apps/api)
        entry: sh -c 'cd apps/api && uv run --extra dev ruff format --check src tests'
        language: system
        files: ^apps/api/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy --strict (apps/api)
        entry: sh -c 'cd apps/api && uv run --extra dev mypy --strict src tests'
        language: system
        files: ^apps/api/.*\.py$
        pass_filenames: false

  # commitlint itself publishes no pre-commit hook (the earlier entry here could never install);
  # this one runs it on a Node that pre-commit downloads, so the machine needs no Node of its own.
  # Same rules as CI's commitlint job (commitlint.config.mjs, config-conventional).
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional@21.2.4"

  # The secret scan of the staged change (specs/006 FR-025); CI's `secrets` job is the authority.
  # Version as infra/VERSIONS.md. pre-commit builds it with Go, which it installs itself.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
