          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: special_days_delete
      summary: Delete a special day (Admin)
      description: >
        A project's own day on the same date stays. 409 pay.project_ended for a day of an ended project.
      tags: [PaySettings]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /projects/{id}/special-days:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv4"

    get:
      operationId: project_days_list
      summary: List the special days a project is paid by (Manager+)
      description: >
        The organisation's days and the project's own, by date; the project's wins on a date both list. An ended project has only its own.
      tags: [PaySettings]
      parameters:
        - name: year
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 9999}
      responses:
        "200":
          description: The days in effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaysInEffect"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    post:
      operationId: project_days_create
      summary: Add a project's special day (Admin)
      description: >
        A day for this project only, or its own rate for an organisation day. 409 special_days.duplicate, pay.project_ended.
      tags: [PaySettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialDayCreate"
      responses:
        "201":
          description: The day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialDayRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /projects/{id}/managers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv4"

    get:
      operationId: project_managers_list
      summary: List a project's managers (Manager+)
      description: >
        The Managers and Admins assigned to the project, by name.
      tags: [PaySettings]
      responses:
        "200":
          description: The managers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
