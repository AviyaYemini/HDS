openapi: "3.1.0"

info:
  title: HDS API — Foundation (Auth + Organisation)
  version: "1.0.0"
  description: |
    Authentication and organisation-management endpoints for HDS 2.0.
    All protected endpoints require a Bearer JWT access token.
    Errors follow RFC 9457 problem-details with a stable machine-readable `code` field.
    Timestamps are ISO 8601 in UTC; clients render in the site's or org's timezone.
    Writes that can be safely retried accept an `Idempotency-Key` header.

servers:
  - url: /api/v1

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:

    # ── Primitives ───────────────────────────────────────────────────────────

    UUIDv4:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    ISODateTime:
      type: string
      format: date-time
      description: ISO 8601 timestamp in UTC (Z suffix).
      example: "2026-11-01T10:00:00Z"

    ISODate:
      type: string
      format: date
      example: "2026-11-01"

    MoneyAmount:
      type: string
      format: decimal
      description: >
        Exact decimal string representation (e.g. "125.5000"). Never a float.
        Stored as NUMERIC(12,4) in the database.
      example: "125.5000"

    IANATimezone:
      type: string
      description: IANA timezone identifier.
      example: "Asia/Jerusalem"

    UserRole:
      type: string
      enum: [employee, manager, admin, client]

    ProjectType:
      type: string
      enum: [security, training]

    ProjectStatus:
      type: string
      enum: [active, ended]

    # ── Problem Details (RFC 9457) ───────────────────────────────────────────

    ProblemDetail:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: "about:blank"
        title:
          type: string
          example: "Unauthorized"
        status:
          type: integer
          example: 401
        detail:
          type: string
          example: "Invalid or expired access token."
        code:
          type: string
          description: Stable machine-readable error code.
          example: "auth.token_invalid"
        instance:
          type: string
          format: uri

    # ── Auth ─────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
        client_kind:
          type: string
          enum: [web, native]
          default: web
          description: >
            What is signing in (007 FR-010, ADR 016). A `native` refresh token lasts
            REFRESH_TOKEN_TTL_DAYS_NATIVE days (30) and renews on every refresh; `web` keeps
            REFRESH_TOKEN_TTL_DAYS (7).

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Access token TTL in seconds (≤ 900).
          example: 900
        refresh_token:
          type: string
          description: Opaque rotating refresh token.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    # ── Organisation ──────────────────────────────────────────────────────────

    OrganisationRead:
      type: object
      required: [id, name, timezone, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        timezone:
          $ref: "#/components/schemas/IANATimezone"
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    # ── Users / Employees ─────────────────────────────────────────────────────

    MeRead:
      description: >
        The signed-in user's profile with what they may do (007 FR-001). `capabilities` are the
        names in specs/007-ux-redesign/contracts/capabilities.md, sorted; `managed_project_ids`
        are the projects a Manager manages, empty for every other role.
      allOf:
        - $ref: "#/components/schemas/UserRead"
        - type: object
          required: [capabilities, managed_project_ids]
          properties:
            capabilities:
              type: array
              items:
                type: string
            managed_project_ids:
              type: array
              items:
                $ref: "#/components/schemas/UUIDv4"

    SessionRead:
      type: object
      required: [id, client_kind, last_refreshed_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        client_kind:
          type: string
          enum: [web, native]
        last_refreshed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    OpeningHours:
      type: object
      required: [weekday, opens, closes]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 is Sunday.
        opens:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        closes:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"

    OrganisationContact:
      type: object
      properties:
        phone:
          type: [string, "null"]
        email:
          type: [string, "null"]
        opening_hours:
          type: array
          items:
            $ref: "#/components/schemas/OpeningHours"

    OrganisationContactUpdate:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: [string, "null"]
          maxLength: 32
        email:
          type: [string, "null"]
          format: email
        opening_hours:
          type: [array, "null"]
          maxItems: 7
          items:
            $ref: "#/components/schemas/OpeningHours"

    UserRead:
      type: object
      required: [id, organization_id, email, full_name, role, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/UserRole"
        is_active:
          type: boolean
        default_hourly_rate:
          $ref: "#/components/schemas/MoneyAmount"
          nullable: true
          description: Visible to Managers/Admins and the user themselves (read-only for employees).
        client_id:
          $ref: "#/components/schemas/UUIDv4"
          nullable: true
          description: Non-null only for role=client.
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ClientUserRead:
      type: object
      description: A client-portal user. Carries no role or rate fields.
      required: [id, organization_id, email, full_name, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        client_id:
          $ref: "#/components/schemas/UUIDv4"
          nullable: true
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    UserCreateRequest:
      type: object
      required: [email, full_name, role, initial_password]
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          maxLength: 32
        role:
          $ref: "#/components/schemas/UserRole"
        default_hourly_rate:
          $ref: "#/components/schemas/MoneyAmount"
          nullable: true
        client_id:
          $ref: "#/components/schemas/UUIDv4"
          nullable: true
          description: Required when role=client.
        initial_password:
          type: string
          minLength: 12
          writeOnly: true
          description: Initial password supplied by the Manager (Proposed; min 12 characters).

    ProfileUpdate:
      type: object
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: [string, "null"]
          maxLength: 32

    UserUpdateRequest:
      type: object
      additionalProperties: false
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: [string, "null"]
          maxLength: 32
        role:
          $ref: "#/components/schemas/UserRole"
        default_hourly_rate:
          anyOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"

    UserListResponse:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserRead"
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when exhausted.
        total:
          type: integer
          description: Total matching records (ignoring pagination).

    # ── Groups ────────────────────────────────────────────────────────────────

    GroupRead:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    GroupWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    GroupRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    GroupListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupRead"

    IDListRequest:
      type: object
      required: [ids]
      description: Full-replacement list of UUIDs (used for group/qualification assignments).
      properties:
        ids:
          type: array
          items:
            $ref: "#/components/schemas/UUIDv4"
          uniqueItems: true

    # ── Qualifications ────────────────────────────────────────────────────────

    QualificationRead:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    QualificationWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    QualificationRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    QualificationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualificationRead"

    # ── Clients ───────────────────────────────────────────────────────────────

    ClientRead:
      type: object
      required: [id, organization_id, name, contract_start, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        contact_name:
          type: string
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        contact_phone:
          type: string
          nullable: true
        contract_start:
          $ref: "#/components/schemas/ISODate"
        contract_end:
          $ref: "#/components/schemas/ISODate"
          nullable: true
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ClientCreateRequest:
      type: object
      required: [name, contract_start]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
          maxLength: 32
        contract_start:
          $ref: "#/components/schemas/ISODate"
        contract_end:
          $ref: "#/components/schemas/ISODate"
          nullable: true

    ClientUpdateRequest:
      type: object
      additionalProperties: false
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        contact_name:
          type: [string, "null"]
        contact_email:
          type: [string, "null"]
          format: email
        contact_phone:
          type: [string, "null"]
          maxLength: 32
        contract_start:
          $ref: "#/components/schemas/ISODate"
          description: >-
            Cannot be cleared. If either date changes, the end may not precede the start, judged
            on the pair after the change with the stored value of a date not sent (422
            clients.date_range_invalid). A pair sent back unchanged is not judged.
        contract_end:
          anyOf:
            - $ref: "#/components/schemas/ISODate"
            - type: "null"
        is_active:
          type: boolean

    ClientListResponse:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientRead"
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer

    # ── Sites ─────────────────────────────────────────────────────────────────

    SiteRead:
      type: object
      required: [id, organization_id, name, address, timezone, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        address:
          type: string
        timezone:
          $ref: "#/components/schemas/IANATimezone"
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    SiteCreateRequest:
      type: object
      required: [name, address, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
        timezone:
          $ref: "#/components/schemas/IANATimezone"

    SiteUpdateRequest:
      type: object
      additionalProperties: false
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        name:
          type: string
        address:
          type: string
        timezone:
          $ref: "#/components/schemas/IANATimezone"

    SiteListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteRead"

    # ── Projects ──────────────────────────────────────────────────────────────

    ProjectRead:
      type: object
      required: [id, organization_id, client_id, site_id, name, type, billing_rate, start_date, status, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        client_id:
          $ref: "#/components/schemas/UUIDv4"
        site_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        type:
          $ref: "#/components/schemas/ProjectType"
        billing_rate:
          $ref: "#/components/schemas/MoneyAmount"
        start_date:
          $ref: "#/components/schemas/ISODate"
        end_date:
          $ref: "#/components/schemas/ISODate"
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ProjectCreateRequest:
      type: object
      required: [client_id, site_id, name, type, billing_rate, start_date]
      properties:
        client_id:
          $ref: "#/components/schemas/UUIDv4"
        site_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: "#/components/schemas/ProjectType"
        billing_rate:
          $ref: "#/components/schemas/MoneyAmount"
        start_date:
          $ref: "#/components/schemas/ISODate"
        end_date:
          $ref: "#/components/schemas/ISODate"
          nullable: true
        pay_settings:
          description: >
            Admin only (403 projects.pay_settings_admin_only): the project's pay switches and its
            own premium values. Without it the project has pay, closed to Managers, and follows
            every default (005).
          anyOf:
            - $ref: "#/components/schemas/ProjectPayChanges"
            - type: "null"

    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        name:
          type: string
        billing_rate:
          $ref: "#/components/schemas/MoneyAmount"
        end_date:
          anyOf:
            - $ref: "#/components/schemas/ISODate"
            - type: "null"
        status:
          $ref: "#/components/schemas/ProjectStatus"

    ProjectListResponse:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRead"
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer

  # ── Reusable parameters ───────────────────────────────────────────────────
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional UUID for safe retries on POST endpoints.

    # ── Availability (003 Part 2) ─────────────────────────────────────────────

    WindowRead:
      type: object
      required: [id, starts_on, ends_on, deadline, is_open]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        starts_on:
          $ref: "#/components/schemas/ISODate"
        ends_on:
          $ref: "#/components/schemas/ISODate"
        deadline:
          $ref: "#/components/schemas/ISODateTime"
        is_open:
          type: boolean
          description: True while now is before the deadline.

    WindowListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WindowRead"

    WindowCreateRequest:
      type: object
      required: [starts_on, ends_on, deadline]
      description: >-
        A period of dates (inclusive) and its deadline. It may not end before it starts (422
        windows.date_range_invalid) or share a date with another window (409 windows.overlap).
      properties:
        starts_on:
          $ref: "#/components/schemas/ISODate"
        ends_on:
          $ref: "#/components/schemas/ISODate"
        deadline:
          $ref: "#/components/schemas/ISODateTime"

    WindowUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        deadline:
          $ref: "#/components/schemas/ISODateTime"

    EntryRead:
      type: object
      required: [id, user_id, kind, absence_kind, starts_on, ends_on, shift_type_id, weekday, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        user_id:
          $ref: "#/components/schemas/UUIDv4"
        kind:
          type: string
          enum: [blocked, open, close, absence]
        absence_kind:
          type: [string, "null"]
          enum: [leave, reserve_duty, sick, null]
        starts_on:
          $ref: "#/components/schemas/ISODate"
        ends_on:
          $ref: "#/components/schemas/ISODate"
        shift_type_id:
          anyOf:
            - $ref: "#/components/schemas/UUIDv4"
            - type: "null"
        weekday:
          type: [integer, "null"]
          minimum: 0
          maximum: 6
          description: 0 Sunday to 6 Saturday.
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    EntryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntryRead"

    EntryCreateRequest:
      type: object
      required: [kind, starts_on, ends_on]
      description: >-
        An absence has an absence_kind and no shift type or weekday; other kinds have no
        absence_kind and may be limited to one shift type and one weekday. An employee may add one
        only for dates in an open window, except an absence; an Admin at any time.
      properties:
        kind:
          type: string
          enum: [blocked, open, close, absence]
        absence_kind:
          type: [string, "null"]
          enum: [leave, reserve_duty, sick, null]
        starts_on:
          $ref: "#/components/schemas/ISODate"
        ends_on:
          $ref: "#/components/schemas/ISODate"
        shift_type_id:
          anyOf:
            - $ref: "#/components/schemas/UUIDv4"
            - type: "null"
        weekday:
          type: [integer, "null"]
          minimum: 0
          maximum: 6

    EntryUpdateRequest:
      type: object
      additionalProperties: false
      description: PATCH; null clears absence_kind, shift_type_id or weekday.
      properties:
        kind:
          type: string
          enum: [blocked, open, close, absence]
        absence_kind:
          type: [string, "null"]
          enum: [leave, reserve_duty, sick, null]
        starts_on:
          $ref: "#/components/schemas/ISODate"
        ends_on:
          $ref: "#/components/schemas/ISODate"
        shift_type_id:
          anyOf:
            - $ref: "#/components/schemas/UUIDv4"
            - type: "null"
        weekday:
          type: [integer, "null"]
          minimum: 0
          maximum: 6

    # ── Shift types (003 Part 2) ──────────────────────────────────────────────

    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
      description: A time of day, HH:MM or HH:MM:SS, local to the site a shift is at; no UTC offset.
      example: "07:00"

    ShiftTypeRead:
      type: object
      required: [id, name, starts_at_local, ends_at_local, crosses_midnight, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        starts_at_local:
          $ref: "#/components/schemas/LocalTime"
        ends_at_local:
          $ref: "#/components/schemas/LocalTime"
        crosses_midnight:
          type: boolean
          description: True exactly when the end is not after the start; computed, never sent.
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ShiftTypeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShiftTypeRead"

    ShiftTypeCreateRequest:
      type: object
      required: [name, starts_at_local, ends_at_local]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        starts_at_local:
          $ref: "#/components/schemas/LocalTime"
        ends_at_local:
          $ref: "#/components/schemas/LocalTime"

    ShiftTypeUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        starts_at_local:
          $ref: "#/components/schemas/LocalTime"
        ends_at_local:
          $ref: "#/components/schemas/LocalTime"
        is_active:
          type: boolean
          description: False retires the type; shifts already made from it stay.

    ShiftTypeIdsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            $ref: "#/components/schemas/UUIDv4"

    # ── Staffing needs and scheduling limits (004) ──────────────────────────

    NeedItem:
      type: object
      additionalProperties: false
      required: [shift_type_id, weekday, headcount]
      properties:
        shift_type_id:
          $ref: "#/components/schemas/UUIDv4"
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 Sunday to 6 Saturday.
        headcount:
          type: integer
          minimum: 1
          maximum: 999

    NeedsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NeedItem"

    NeedsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NeedItem"

    SchedulingSettings:
      type: object
      required: [min_rest_hours, max_weekly_hours]
      properties:
        min_rest_hours:
          type: integer
        max_weekly_hours:
          type: integer

    SchedulingSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        min_rest_hours:
          type: integer
          minimum: 1
          maximum: 24
        max_weekly_hours:
          type: integer
          minimum: 1
          maximum: 168

    /organisation/contact:
    get:
      operationId: organisation_contact_read
      summary: Read the contact card (every role, 007 FR-012)
      tags: [Organisation]
      responses:
        "200":
          description: The organisation's phone, e-mail and opening hours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationContact"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      operationId: organisation_contact_change
      summary: Change the contact card (Admin, 007 FR-012)
      tags: [Organisation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationContactUpdate"
      responses:
        "200":
          description: The card as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationContact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Schedule jobs (004) ──────────────────────────────────────────────────

    JobCreateRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/ISODate"
        to:
          $ref: "#/components/schemas/ISODate"
        project_ids:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/UUIDv4"
        solver:
          type: string
          enum: [greedy, cpsat]
          default: cpsat

    JobSummary:
      type: object
      required: [id, status, from, to, project_ids, solver, requested_by, settings, created_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        from:
          $ref: "#/components/schemas/ISODate"
        to:
          $ref: "#/components/schemas/ISODate"
        project_ids:
          type: array
          items:
            $ref: "#/components/schemas/UUIDv4"
        solver:
          type: string
        requested_by:
          $ref: "#/components/schemas/UUIDv4"
        settings:
          $ref: "#/components/schemas/SchedulingSettings"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error_code:
          type: string
          nullable: true
          description: jobs.solver_failed or jobs.worker_lost when failed.
        optimal:
          type: boolean
          nullable: true
        proposal_state:
          type: string
          nullable: true
          enum: [open, accepted, discarded, expired]

    JobRead:
      allOf:
        - $ref: "#/components/schemas/JobSummary"
        - type: object
          properties:
            proposal:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/Proposal"

    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobSummary"
        next_cursor:
          type: string
          nullable: true

    Proposal:
      type: object
      description: Who works each slot, what stays empty and why, and what it changes; employees by id only.
      required: [slots, unfilled, employees, no_availability, short_published, changes]
      properties:
        slots:
          type: array
          items:
            type: object
            required: [key, project_id, shift_type_id, date, starts_at, ends_at, headcount, assigned, kept]
            properties:
              key: {type: string}
              shift_id: {type: string, format: uuid, nullable: true}
              project_id: {$ref: "#/components/schemas/UUIDv4"}
              shift_type_id: {$ref: "#/components/schemas/UUIDv4"}
              date: {$ref: "#/components/schemas/ISODate"}
              starts_at: {type: string, format: date-time}
              ends_at: {type: string, format: date-time}
              headcount: {type: integer}
              assigned: {type: array, items: {$ref: "#/components/schemas/UUIDv4"}}
              kept: {type: array, items: {$ref: "#/components/schemas/UUIDv4"}}
        unfilled:
          type: array
          items:
            type: object
            required: [key, places, reasons]
            properties:
              key: {type: string}
              places: {type: integer}
              reasons:
                type: array
                items:
                  type: object
                  required: [code, employees]
                  properties:
                    code:
                      type: string
                      enum: [schedule.unavailable, schedule.overlap, schedule.minimum_rest, schedule.weekly_maximum, schedule.needed_elsewhere, schedule.no_active_employee]
                    employees: {type: integer}
        employees:
          type: array
          items:
            type: object
            required: [user_id, minutes, nights, open_met, close_not_met]
            properties:
              user_id: {$ref: "#/components/schemas/UUIDv4"}
              minutes: {type: integer}
              nights: {type: integer}
              open_met: {type: integer}
              close_not_met: {type: integer}
        no_availability:
          type: array
          items: {$ref: "#/components/schemas/UUIDv4"}
        short_published:
          type: array
          items:
            type: object
            required: [shift_id, needed, assigned]
            properties:
              shift_id: {$ref: "#/components/schemas/UUIDv4"}
              needed: {type: integer}
              assigned: {type: integer}
        changes:
          type: object
          required: [added, removed]
          properties:
            added:
              type: array
              items: {type: object, required: [key, user_id], properties: {key: {type: string}, user_id: {$ref: "#/components/schemas/UUIDv4"}}}
            removed:
              type: array
              items: {type: object, required: [key, user_id], properties: {key: {type: string}, user_id: {$ref: "#/components/schemas/UUIDv4"}}}

    # ── Manual roster (003 Part 2) ────────────────────────────────────────────

    Money:
      type: string
      pattern: "^(?!0+(\\.0+)?$)\\d{1,8}(\\.\\d{1,4})?$"
      description: A positive decimal string, never a JSON number.
      example: "75.0000"

    AssignmentRead:
      type: object
      required: [id, shift_id, user_id]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        shift_id:
          $ref: "#/components/schemas/UUIDv4"
        user_id:
          $ref: "#/components/schemas/UUIDv4"

    ShiftRead:
      type: object
      required: [id, project_id, shift_type_id, starts_at, ends_at, timezone, headcount, pay_rate, status, published_at, assignments]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        project_id:
          $ref: "#/components/schemas/UUIDv4"
        shift_type_id:
          $ref: "#/components/schemas/UUIDv4"
        starts_at:
          $ref: "#/components/schemas/ISODateTime"
        ends_at:
          $ref: "#/components/schemas/ISODateTime"
        timezone:
          type: string
          description: The IANA time zone of the project's site.
        headcount:
          type: integer
          minimum: 1
        pay_rate:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        status:
          type: string
          enum: [draft, published]
        published_at:
          anyOf:
            - $ref: "#/components/schemas/ISODateTime"
            - type: "null"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentRead"

    RuleWarning:
      type: object
      required: [code, employee_id, shift_ids, detail]
      description: A rule a change breaks; the change was stored anyway (003 FR-116).
      properties:
        code:
          type: string
          enum: [warnings.overlap, warnings.rest_too_short, warnings.weekly_hours_exceeded, warnings.blocked, warnings.absence, warnings.close_preference, warnings.over_headcount, warnings.under_headcount, warnings.employee_inactive]
        employee_id:
          anyOf:
            - $ref: "#/components/schemas/UUIDv4"
            - type: "null"
        shift_ids:
          type: array
          items:
            $ref: "#/components/schemas/UUIDv4"
        detail:
          type: string

    ShiftAnswer:
      type: object
      required: [shift, warnings]
      properties:
        shift:
          $ref: "#/components/schemas/ShiftRead"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/RuleWarning"

    AssignmentAnswer:
      type: object
      required: [assignment, warnings]
      properties:
        assignment:
          $ref: "#/components/schemas/AssignmentRead"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/RuleWarning"

    WarningsAnswer:
      type: object
      required: [warnings]
      properties:
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/RuleWarning"

    ShiftPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShiftRead"
        next_cursor:
          type: [string, "null"]

    ShiftCreateRequest:
      type: object
      required: [project_id, shift_type_id, date]
      description: >-
        Times are the shift type's local times on the date at the project's site, unless starts_at
        and ends_at are both given (422 shifts.times_invalid if only one is, or they do not end after
        they start). The project must use the type (422 shifts.type_not_in_project).
      properties:
        project_id:
          $ref: "#/components/schemas/UUIDv4"
        shift_type_id:
          $ref: "#/components/schemas/UUIDv4"
        date:
          $ref: "#/components/schemas/ISODate"
        headcount:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        pay_rate:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        starts_at:
          anyOf:
            - $ref: "#/components/schemas/ISODateTime"
            - type: "null"
        ends_at:
          anyOf:
            - $ref: "#/components/schemas/ISODateTime"
            - type: "null"

    ShiftUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        starts_at:
          $ref: "#/components/schemas/ISODateTime"
        ends_at:
          $ref: "#/components/schemas/ISODateTime"
        headcount:
          type: integer
          minimum: 1
          maximum: 1000
        pay_rate:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"

    AssignRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          $ref: "#/components/schemas/UUIDv4"

    # ── Publishing and my shifts (003 Part 2) ─────────────────────────────────

    PublishRequest:
      type: object
      required: [from, to]
      description: Dates at the project's site; to may not be before from (422 shifts.date_range_invalid).
      properties:
        from:
          $ref: "#/components/schemas/ISODate"
        to:
          $ref: "#/components/schemas/ISODate"

    PublishAnswer:
      type: object
      required: [published]
      properties:
        published:
          type: integer
          description: How many drafts were published.

    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string

    MyShift:
      type: object
      required: [id, starts_at, ends_at, timezone, shift_type, project, site]
      description: One of the caller's own published shifts; nothing about anyone else on it.
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        starts_at:
          $ref: "#/components/schemas/ISODateTime"
        ends_at:
          $ref: "#/components/schemas/ISODateTime"
        timezone:
          type: string
          description: The IANA time zone of the site.
        shift_type:
          type: string
        project:
          $ref: "#/components/schemas/NamedRef"
        site:
          $ref: "#/components/schemas/NamedRef"

    MyShiftDetail:
      description: >
        One of the caller's published shifts with the site's address and the project's managers
        to contact, who stand in for a shift leader (007 FR-023).
      allOf:
        - $ref: "#/components/schemas/MyShift"
        - type: object
          required: [site_address, contacts]
          properties:
            site_address:
              type: [string, "null"]
            contacts:
              type: array
              items:
                type: object
                required: [full_name, phone, email]
                properties:
                  full_name:
                    type: string
                  phone:
                    type: [string, "null"]
                  email:
                    type: string
                    format: email

    SubmissionRead:
      type: object
      required: [window_id, status, submitted_at, submitted_by, deadline, counted_unavailable]
      description: >
        Where the caller's availability for one window stands (007 FR-014). `status` is derived:
        `locked` after the deadline; else `submitted` while the entries equal what was submitted,
        `draft` after a change or with entries, `not_submitted` with neither.
        `counted_unavailable` is true after the deadline when nothing was submitted.
      properties:
        window_id:
          $ref: "#/components/schemas/UUIDv4"
        status:
          type: string
          enum: [not_submitted, draft, submitted, locked]
        submitted_at:
          oneOf:
            - $ref: "#/components/schemas/ISODateTime"
            - type: "null"
        submitted_by:
          description: The employee, or the Admin who submitted on their behalf.
          oneOf:
            - $ref: "#/components/schemas/UUIDv4"
            - type: "null"
        deadline:
          $ref: "#/components/schemas/ISODateTime"
        counted_unavailable:
          type: boolean

    MyShiftList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyShift"

  # ── Reusable responses ────────────────────────────────────────────────────
    # ── Pay settings, special days and managers on projects (005) ───────────

    Percent:
      type: string
      pattern: "^(?:(?:1[0-9]{2}|2[0-9]{2})(?:\\.[0-9]{1,2})?|300(?:\\.0{1,2})?)$"
      description: A rate in percent of the base rate, 100 to 300, as a decimal string.
      example: "125.00"

    Points:
      type: string
      pattern: "^(?:(?!0+(?:\\.0+)?$)(?:[0-9]{1,2}|1[0-9]{2})(?:\\.[0-9]{1,2})?|200(?:\\.0{1,2})?)$"
      description: Percentage points added to a day's rate for overtime, above 0 and at most 200.
      example: "25.00"

    Minutes:
      type: integer
      minimum: 1
      maximum: 1440

    RestWindow:
      type: object
      additionalProperties: false
      description: >
        The weekly rest, from a weekday (0 Sunday to 6 Saturday) and local time to a weekday and
        local time at the site, read forward from its start; its ends must differ.
      required: [start_weekday, start_time, end_weekday, end_time]
      properties:
        start_weekday: {type: integer, minimum: 0, maximum: 6}
        start_time:
          $ref: "#/components/schemas/LocalTime"
        end_weekday: {type: integer, minimum: 0, maximum: 6}
        end_time:
          $ref: "#/components/schemas/LocalTime"

    PremiumSettings:
      type: object
      description: >
        What a shift's hours are paid, in percent of the base rate. Hours beyond the normal length
        (the night length on a night shift) are overtime, the first tier at overtime1_pct and the
        rest at overtime2_pct; hours in the weekly rest at rest_pct; on a rest or special day,
        overtime adds increase1_points or increase2_points to the day's rate.
      required: [day_normal_minutes, night_normal_minutes, tier1_minutes, overtime1_pct,
                 overtime2_pct, rest_window, rest_pct, increase1_points, increase2_points]
      properties:
        day_normal_minutes: {type: integer}
        night_normal_minutes: {type: integer}
        tier1_minutes: {type: integer}
        overtime1_pct: {$ref: "#/components/schemas/Percent"}
        overtime2_pct: {$ref: "#/components/schemas/Percent"}
        rest_window: {$ref: "#/components/schemas/RestWindow"}
        rest_pct: {$ref: "#/components/schemas/Percent"}
        increase1_points: {$ref: "#/components/schemas/Points"}
        increase2_points: {$ref: "#/components/schemas/Points"}

    PremiumChanges:
      type: object
      additionalProperties: false
      description: Any of the defaults; omitted ones stay, null is refused.
      properties:
        day_normal_minutes: {$ref: "#/components/schemas/Minutes"}
        night_normal_minutes: {$ref: "#/components/schemas/Minutes"}
        tier1_minutes: {$ref: "#/components/schemas/Minutes"}
        overtime1_pct: {$ref: "#/components/schemas/Percent"}
        overtime2_pct: {$ref: "#/components/schemas/Percent"}
        rest_window: {$ref: "#/components/schemas/RestWindow"}
        rest_pct: {$ref: "#/components/schemas/Percent"}
        increase1_points: {$ref: "#/components/schemas/Points"}
        increase2_points: {$ref: "#/components/schemas/Points"}

    PremiumOverrides:
      type: object
      additionalProperties: false
      description: A project's own values; null returns a setting to the organisation's default.
      properties:
        day_normal_minutes: {anyOf: [{$ref: "#/components/schemas/Minutes"}, {type: "null"}]}
        night_normal_minutes: {anyOf: [{$ref: "#/components/schemas/Minutes"}, {type: "null"}]}
        tier1_minutes: {anyOf: [{$ref: "#/components/schemas/Minutes"}, {type: "null"}]}
        overtime1_pct: {anyOf: [{$ref: "#/components/schemas/Percent"}, {type: "null"}]}
        overtime2_pct: {anyOf: [{$ref: "#/components/schemas/Percent"}, {type: "null"}]}
        rest_window: {anyOf: [{$ref: "#/components/schemas/RestWindow"}, {type: "null"}]}
        rest_pct: {anyOf: [{$ref: "#/components/schemas/Percent"}, {type: "null"}]}
        increase1_points: {anyOf: [{$ref: "#/components/schemas/Points"}, {type: "null"}]}
        increase2_points: {anyOf: [{$ref: "#/components/schemas/Points"}, {type: "null"}]}

    ProjectPayChanges:
      type: object
      additionalProperties: false
      properties:
        pay_enabled: {type: boolean}
        managers_see_pay: {type: boolean}
        settings: {$ref: "#/components/schemas/PremiumOverrides"}

    ProjectPayRead:
      type: object
      description: >
        Whether the project has pay, whether its assigned Managers see it, the settings in effect,
        and which of them are the project's own (own); the rest follow the organisation.
      required: [pay_enabled, managers_see_pay, settings, own]
      properties:
        pay_enabled: {type: boolean}
        managers_see_pay: {type: boolean}
        settings: {$ref: "#/components/schemas/PremiumSettings"}
        own:
          type: array
          items: {type: string}

    SpecialDayCreate:
      type: object
      required: [day, name]
      properties:
        day: {$ref: "#/components/schemas/ISODate"}
        name: {type: string, minLength: 1, maxLength: 255}
        rate_pct: {anyOf: [{$ref: "#/components/schemas/Percent"}, {type: "null"}]}

    SpecialDayChange:
      type: object
      additionalProperties: false
      properties:
        day: {$ref: "#/components/schemas/ISODate"}
        name: {type: string, minLength: 1, maxLength: 255}
        rate_pct: {$ref: "#/components/schemas/Percent"}

    SpecialDayRead:
      type: object
      required: [id, project_id, day, name, rate_pct]
      properties:
        id: {$ref: "#/components/schemas/UUIDv4"}
        project_id:
          anyOf:
            - $ref: "#/components/schemas/UUIDv4"
            - type: "null"
        day: {$ref: "#/components/schemas/ISODate"}
        name: {type: string}
        rate_pct: {$ref: "#/components/schemas/Percent"}

    SpecialDayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SpecialDayRead"}

    DayInEffect:
      allOf:
        - $ref: "#/components/schemas/SpecialDayRead"
        - type: object
          required: [source]
          properties:
            source: {type: string, enum: [project, organisation]}

    DaysInEffect:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/DayInEffect"}

    ManagersRequest:
      type: object
      additionalProperties: false
      required: [user_ids]
      properties:
        user_ids:
          type: array
          maxItems: 1000
          items: {$ref: "#/components/schemas/UUIDv4"}

    ManagersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, full_name]
            properties:
              id: {$ref: "#/components/schemas/UUIDv4"}
              full_name: {type: string}

    Amount:
      type: string
      pattern: "^[0-9]{1,10}\\.[0-9]{2}$"
      description: A money amount with two decimals, never a JSON number (005).
      example: "612.50"

    Hours:
      type: string
      pattern: "^[0-9]{1,7}\\.[0-9]{2}$"
      description: Hours with two decimals.
      example: "7.50"

    PayLine:
      type: object
      description: >
        One ended shift of the caller's, priced. pay is left out when the project has pay switched
        off (pay_enabled false) or there is no rate (rate_missing); missing pay is never zero.
      required: [shift_id, project_id, project_name, date, starts_at, ends_at, hours, base_rate,
                 rate_missing, pay_enabled, parts]
      properties:
        shift_id: {$ref: "#/components/schemas/UUIDv4"}
        project_id: {$ref: "#/components/schemas/UUIDv4"}
        project_name: {type: string}
        date: {$ref: "#/components/schemas/ISODate"}
        starts_at: {$ref: "#/components/schemas/ISODateTime"}
        ends_at: {$ref: "#/components/schemas/ISODateTime"}
        hours: {$ref: "#/components/schemas/Hours"}
        base_rate:
          anyOf:
            - {type: string}
            - {type: "null"}
        rate_missing: {type: boolean}
        pay_enabled: {type: boolean}
        parts:
          type: array
          items:
            type: object
            required: [rate_pct, hours]
            properties:
              rate_pct: {$ref: "#/components/schemas/Percent"}
              hours: {$ref: "#/components/schemas/Hours"}
        pay: {$ref: "#/components/schemas/Amount"}

    PayToDate:
      type: object
      description: The caller's gross pay for a month so far; totals are sums of the lines shown.
      required: [month, lines, hours, pay, shifts_missing_rate]
      properties:
        month: {type: string, example: "2026-10"}
        lines:
          type: array
          items: {$ref: "#/components/schemas/PayLine"}
        hours: {$ref: "#/components/schemas/Hours"}
        pay: {$ref: "#/components/schemas/Amount"}
        shifts_missing_rate: {type: integer}

    WorkLog:
      type: object
      description: Who worked in the range, once per person and project, by name; never any pay.
      required: [from, to, rows]
      properties:
        from: {$ref: "#/components/schemas/ISODate"}
        to: {$ref: "#/components/schemas/ISODate"}
        rows:
          type: array
          items:
            type: object
            required: [user_id, full_name, project_id, project_name, shifts, hours, first_date,
                       last_date]
            properties:
              user_id: {$ref: "#/components/schemas/UUIDv4"}
              full_name: {type: string}
              project_id: {$ref: "#/components/schemas/UUIDv4"}
              project_name: {type: string}
              shifts: {type: integer}
              hours: {$ref: "#/components/schemas/Hours"}
              first_date: {$ref: "#/components/schemas/ISODate"}
              last_date: {$ref: "#/components/schemas/ISODate"}

    HoursRow:
      type: object
      description: One employee at one project; pay only where the reader may see it.
      required: [id, name, hours, shifts, shifts_missing_rate]
      properties:
        id: {$ref: "#/components/schemas/UUIDv4"}
        name: {type: string}
        hours: {$ref: "#/components/schemas/Hours"}
        shifts: {type: integer}
        shifts_missing_rate: {type: integer}
        pay: {$ref: "#/components/schemas/Amount"}

    HoursGroup:
      allOf:
        - $ref: "#/components/schemas/HoursRow"
        - type: object
          required: [rows]
          properties:
            rows:
              type: array
              items: {$ref: "#/components/schemas/HoursRow"}

    HoursReport:
      type: object
      description: >
        Hours and shifts by employee or project, with grand totals. pay appears only where the
        reader may see it, and pay totals cover only the lines shown with pay.
      required: [from, to, group_by, groups, hours, shifts, shifts_missing_rate]
      properties:
        from: {$ref: "#/components/schemas/ISODate"}
        to: {$ref: "#/components/schemas/ISODate"}
        group_by: {type: string, enum: [employee, project]}
        groups:
          type: array
          items: {$ref: "#/components/schemas/HoursGroup"}
        hours: {$ref: "#/components/schemas/Hours"}
        shifts: {type: integer}
        shifts_missing_rate: {type: integer}
        pay: {$ref: "#/components/schemas/Amount"}

  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: Authenticated but insufficient role or data scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found (or hidden by soft delete / scope filter).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Uniqueness conflict (e.g. duplicate email within the organisation).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnprocessableEntity:
      description: Validation error (invalid field values).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadRequest:
      description: The request body could not be parsed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: Too many failed sign-ins from this network.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ServiceBusy:
      description: The password-hashing queue is full; nothing was changed.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

# ---------------------------------------------------------------------------
# Global security (overridden on public auth endpoints)
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      operationId: auth_login
      summary: Sign in with email and password
      tags: [Auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful sign-in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Unauthorized"
                status: 401
                code: "auth.invalid_credentials"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "423":
          description: Account locked due to too many failed attempts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Locked"
                status: 423
                detail: "Account locked for 15 minutes. Contact your manager if urgent."
                code: "auth.account_locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /auth/refresh:
    post:
      operationId: auth_refresh
      summary: Exchange a refresh token for a new access token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token issued; old refresh token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/logout:
    post:
      operationId: auth_logout
      summary: Sign out (invalidate current refresh token)
      tags: [Auth]
      responses:
        "204":
          description: Session invalidated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/logout-all:
    post:
      operationId: auth_logout_all
      summary: Sign out of all devices (invalidate all refresh tokens)
      tags: [Auth]
      responses:
        "204":
          description: All sessions invalidated.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/invite:
    post:
      operationId: auth_invite
      summary: Invite a user by email (Manager+)
      description: >
        Always answers 202 with an empty body. The invitation token is delivered only by email.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/UserRole"
      responses:
        "202":
          description: Invitation accepted for delivery.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /auth/invite/accept:
    post:
      operationId: auth_invite_accept
      summary: Accept an invitation and set a password
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
                  writeOnly: true
      responses:
        "204":
          description: Account activated; the user can now sign in.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Token invalid, expired or already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /auth/password-reset/request:
    post:
      operationId: auth_password_reset_request
      summary: Request a password-reset email
      description: >
        Always answers 202 with an empty body, whether or not the email is known and whether or
        not a limit is reached. The request only counts and answers: the account is looked at and
        the email sent after the response, so a failure there is not reported. Earlier links keep
        working until one is redeemed, which cancels the rest. Requests are limited per address
        and per network in a 60-minute window; over a limit nothing is issued or sent.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Request accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm
      summary: Set a new password using a reset token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  writeOnly: true
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Token invalid, expired or already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  # ── Current user (self) ───────────────────────────────────────────────────

  /me:
    get:
      operationId: me_get
      summary: Get the current user's profile and capabilities
      tags: [Me]
      responses:
        "200":
          description: Current user's profile, capabilities and managed projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeRead"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      operationId: me_update
      summary: Update the current user's own profile (name and phone only)
      tags: [Me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /me/sessions:
    get:
      operationId: me_sessions_list
      summary: List the current user's live sessions, one per device (007 N12)
      tags: [Me]
      responses:
        "200":
          description: Live sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionRead"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/sessions/{id}:
    delete:
      operationId: me_sessions_end
      summary: End one of the current user's sessions (007 N12)
      tags: [Me]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUIDv4"
      responses:
        "204":
          description: Session ended; its access token lapses within 15 minutes.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Employees ─────────────────────────────────────────────────────────────

  /employees:
    get:
      operationId: employees_list
      summary: List employees (Manager+)
      tags: [Employees]
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Full-name or email search.
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: group_id
          in: query
          schema:
            $ref: "#/components/schemas/UUIDv4"
        - name: qualification_id
          in: query
          schema:
            $ref: "#/components/schemas/UUIDv4"
      responses:
        "200":
          description: Paginated employee list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    post:
      operationId: employees_create
      summary: Create a new employee (Manager+)
      tags: [Employees]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Employee created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /employees/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv4"

    get:
      operationId: employees_get
      summary: Get an employee by ID (Manager+, or self)
      tags: [Employees]
      responses:
        "200":
          description: Employee record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    patch:
      operationId: employees_update
      summary: Update an employee (Manager+ or self with restricted fields)
      tags: [Employees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated employee record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: employees_delete
      summary: Soft-delete an employee record (Admin only)
      tags: [Employees]
      responses:
        "204":
          description: Employee hidden (soft-deleted); history preserved.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /employees/{id}/deactivate:
    post:
      operationId: employees_deactivate
      summary: Deactivate an employee (Manager+)
      tags: [Employees]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUIDv4"
      responses:
        "200":
          description: Employee deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot deactivate the last active Admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
