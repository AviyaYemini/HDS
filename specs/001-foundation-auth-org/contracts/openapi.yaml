          description: Group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv4"

    patch:
      operationId: groups_update
      summary: Rename a group (Manager+)
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRenameRequest"
      responses:
        "200":
          description: Updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: groups_delete
      summary: Delete a group (Manager+)
      tags: [Groups]
      responses:
        "204":
          description: Group deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Qualifications ────────────────────────────────────────────────────────

  /qualifications:
    get:
      operationId: qualifications_list
      summary: List all qualifications in the organisation (Manager+)
      tags: [Qualifications]
      responses:
        "200":
          description: Qualification list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: qualifications_create
      summary: Create a new qualification (Manager+)
      tags: [Qualifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualificationWriteRequest"
      responses:
        "201":
          description: Qualification created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
