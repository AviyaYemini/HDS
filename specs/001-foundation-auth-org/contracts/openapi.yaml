openapi: "3.1.0"

info:
  title: HDS API — Foundation (Auth + Organisation)
  version: "1.0.0"
  description: |
    Authentication and organisation-management endpoints for HDS 2.0.
    All protected endpoints require a Bearer JWT access token.
    Errors follow RFC 9457 problem-details with a stable machine-readable `code` field.
    Timestamps are ISO 8601 in UTC; clients render in the site's or org's timezone.
    Writes that can be safely retried accept an `Idempotency-Key` header.

servers:
  - url: /api/v1

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:

    # ── Primitives ───────────────────────────────────────────────────────────

    UUIDv4:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    ISODateTime:
      type: string
      format: date-time
      description: ISO 8601 timestamp in UTC (Z suffix).
      example: "2026-11-01T10:00:00Z"

    ISODate:
      type: string
      format: date
      example: "2026-11-01"

    MoneyAmount:
      type: string
      format: decimal
      description: >
        Exact decimal string representation (e.g. "125.5000"). Never a float.
        Stored as NUMERIC(12,4) in the database.
      example: "125.5000"

    IANATimezone:
      type: string
      description: IANA timezone identifier.
      example: "Asia/Jerusalem"

    UserRole:
      type: string
      enum: [employee, manager, admin, client]

    ProjectType:
      type: string
      enum: [security, training]

    ProjectStatus:
      type: string
      enum: [active, ended]

    # ── Problem Details (RFC 9457) ───────────────────────────────────────────

    ProblemDetail:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: "about:blank"
        title:
          type: string
          example: "Unauthorized"
        status:
          type: integer
          example: 401
        detail:
          type: string
          example: "Invalid or expired access token."
        code:
          type: string
          description: Stable machine-readable error code.
          example: "auth.token_invalid"
        instance:
          type: string
          format: uri

    # ── Auth ─────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Access token TTL in seconds (≤ 900).
          example: 900
        refresh_token:
          type: string
          description: Opaque rotating refresh token.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    # ── Organisation ──────────────────────────────────────────────────────────

    OrganisationRead:
      type: object
      required: [id, name, timezone, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        timezone:
          $ref: "#/components/schemas/IANATimezone"
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    # ── Users / Employees ─────────────────────────────────────────────────────

    UserRead:
      type: object
      required: [id, organization_id, email, full_name, role, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/UserRole"
        is_active:
          type: boolean
        default_hourly_rate:
          $ref: "#/components/schemas/MoneyAmount"
          nullable: true
          description: Visible to Managers/Admins and the user themselves (read-only for employees).
        client_id:
          $ref: "#/components/schemas/UUIDv4"
          nullable: true
          description: Non-null only for role=client.
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ClientUserRead:
      type: object
      description: A client-portal user. Carries no role or rate fields.
      required: [id, organization_id, email, full_name, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        client_id:
          $ref: "#/components/schemas/UUIDv4"
          nullable: true
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    UserCreateRequest:
      type: object
      required: [email, full_name, role, initial_password]
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          maxLength: 32
        role:
          $ref: "#/components/schemas/UserRole"
        default_hourly_rate:
          $ref: "#/components/schemas/MoneyAmount"
          nullable: true
        client_id:
          $ref: "#/components/schemas/UUIDv4"
          nullable: true
          description: Required when role=client.
        initial_password:
          type: string
          minLength: 12
          writeOnly: true
          description: Initial password supplied by the Manager (Proposed; min 12 characters).

    ProfileUpdate:
      type: object
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: [string, "null"]
          maxLength: 32

    UserUpdateRequest:
      type: object
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: [string, "null"]
          maxLength: 32
        role:
          $ref: "#/components/schemas/UserRole"
        default_hourly_rate:
          anyOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"

    UserListResponse:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserRead"
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when exhausted.
        total:
          type: integer
          description: Total matching records (ignoring pagination).

    # ── Groups ────────────────────────────────────────────────────────────────

    GroupRead:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    GroupWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    GroupListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupRead"

    IDListRequest:
      type: object
      required: [ids]
      description: Full-replacement list of UUIDs (used for group/qualification assignments).
      properties:
        ids:
          type: array
          items:
            $ref: "#/components/schemas/UUIDv4"
          uniqueItems: true

    # ── Qualifications ────────────────────────────────────────────────────────

    QualificationRead:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    QualificationWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    QualificationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualificationRead"

    # ── Clients ───────────────────────────────────────────────────────────────

    ClientRead:
      type: object
      required: [id, organization_id, name, contract_start, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        contact_name:
          type: string
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        contact_phone:
          type: string
          nullable: true
        contract_start:
          $ref: "#/components/schemas/ISODate"
        contract_end:
          $ref: "#/components/schemas/ISODate"
          nullable: true
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ClientCreateRequest:
      type: object
      required: [name, contract_start]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
          maxLength: 32
        contract_start:
          $ref: "#/components/schemas/ISODate"
        contract_end:
          $ref: "#/components/schemas/ISODate"
          nullable: true

    ClientUpdateRequest:
      type: object
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        contact_name:
          type: [string, "null"]
        contact_email:
          type: [string, "null"]
          format: email
        contact_phone:
          type: [string, "null"]
          maxLength: 32
        contract_start:
          $ref: "#/components/schemas/ISODate"
          description: >-
            Cannot be cleared. If either date changes, the end may not precede the start, judged
            on the pair after the change with the stored value of a date not sent (422
            clients.date_range_invalid). A pair sent back unchanged is not judged.
        contract_end:
          anyOf:
            - $ref: "#/components/schemas/ISODate"
            - type: "null"
        is_active:
          type: boolean

    ClientListResponse:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientRead"
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer

    # ── Sites ─────────────────────────────────────────────────────────────────

    SiteRead:
      type: object
      required: [id, organization_id, name, address, timezone, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        address:
          type: string
        timezone:
          $ref: "#/components/schemas/IANATimezone"
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    SiteCreateRequest:
      type: object
      required: [name, address, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
        timezone:
          $ref: "#/components/schemas/IANATimezone"

    SiteUpdateRequest:
      type: object
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        name:
          type: string
        address:
          type: string
        timezone:
          $ref: "#/components/schemas/IANATimezone"

    SiteListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteRead"

    # ── Projects ──────────────────────────────────────────────────────────────

    ProjectRead:
      type: object
      required: [id, organization_id, client_id, site_id, name, type, billing_rate, start_date, status, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        client_id:
          $ref: "#/components/schemas/UUIDv4"
        site_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        type:
          $ref: "#/components/schemas/ProjectType"
        billing_rate:
          $ref: "#/components/schemas/MoneyAmount"
        start_date:
          $ref: "#/components/schemas/ISODate"
        end_date:
          $ref: "#/components/schemas/ISODate"
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ProjectCreateRequest:
      type: object
      required: [client_id, site_id, name, type, billing_rate, start_date]
      properties:
        client_id:
          $ref: "#/components/schemas/UUIDv4"
        site_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: "#/components/schemas/ProjectType"
        billing_rate:
          $ref: "#/components/schemas/MoneyAmount"
        start_date:
          $ref: "#/components/schemas/ISODate"
        end_date:
          $ref: "#/components/schemas/ISODate"
          nullable: true

    ProjectUpdateRequest:
      type: object
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        name:
          type: string
        billing_rate:
          $ref: "#/components/schemas/MoneyAmount"
        end_date:
          anyOf:
            - $ref: "#/components/schemas/ISODate"
            - type: "null"
        status:
          $ref: "#/components/schemas/ProjectStatus"

    ProjectListResponse:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRead"
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer

  # ── Reusable parameters ───────────────────────────────────────────────────
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional UUID for safe retries on POST endpoints.

  # ── Reusable responses ────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: Authenticated but insufficient role or data scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found (or hidden by soft delete / scope filter).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Uniqueness conflict (e.g. duplicate email within the organisation).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnprocessableEntity:
      description: Validation error (invalid field values).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadRequest:
      description: The request body could not be parsed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: Too many failed sign-ins from this network.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ServiceBusy:
      description: The password-hashing queue is full; nothing was changed.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

# ---------------------------------------------------------------------------
# Global security (overridden on public auth endpoints)
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      operationId: auth_login
      summary: Sign in with email and password
      tags: [Auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful sign-in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Unauthorized"
                status: 401
                code: "auth.invalid_credentials"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "423":
          description: Account locked due to too many failed attempts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Locked"
                status: 423
                detail: "Account locked for 15 minutes. Contact your manager if urgent."
                code: "auth.account_locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /auth/refresh:
    post:
      operationId: auth_refresh
      summary: Exchange a refresh token for a new access token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token issued; old refresh token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/logout:
    post:
      operationId: auth_logout
      summary: Sign out (invalidate current refresh token)
      tags: [Auth]
      responses:
        "204":
          description: Session invalidated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/logout-all:
    post:
      operationId: auth_logout_all
      summary: Sign out of all devices (invalidate all refresh tokens)
      tags: [Auth]
      responses:
        "204":
          description: All sessions invalidated.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/invite:
    post:
      operationId: auth_invite
      summary: Invite a user by email (Manager+)
      description: >
        Always answers 202 with an empty body. The invitation token is delivered only by email.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/UserRole"
      responses:
        "202":
          description: Invitation accepted for delivery.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /auth/invite/accept:
    post:
      operationId: auth_invite_accept
      summary: Accept an invitation and set a password
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
                  writeOnly: true
      responses:
        "204":
          description: Account activated; the user can now sign in.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Token invalid, expired or already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /auth/password-reset/request:
    post:
      operationId: auth_password_reset_request
      summary: Request a password-reset email
      description: >
        Always answers 202 with an empty body, whether or not the email is known and whether or
        not a limit is reached. The request only counts and answers: the account is looked at and
        the email sent after the response, so a failure there is not reported. Earlier links keep
        working until one is redeemed, which cancels the rest. Requests are limited per address
        and per network in a 60-minute window; over a limit nothing is issued or sent.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Request accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm
      summary: Set a new password using a reset token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  writeOnly: true
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Token invalid, expired or already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  # ── Current user (self) ───────────────────────────────────────────────────

  /me:
    get:
      operationId: me_get
      summary: Get the current user's profile
      tags: [Me]
      responses:
        "200":
          description: Current user's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      operationId: me_update
      summary: Update the current user's own profile (name and phone only)
      tags: [Me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
