    put:
      operationId: project_managers_replace
      summary: Set a project's managers (Admin)
      description: >
        Replace them as a whole; each must be an active Manager or Admin of the organisation (422 project_managers.not_staff).
      tags: [PaySettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagersRequest"
      responses:
        "200":
          description: The managers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagersResponse"
