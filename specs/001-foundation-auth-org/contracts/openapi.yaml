openapi: "3.1.0"

info:
  title: HDS API — Foundation (Auth + Organisation)
  version: "1.0.0"
  description: |
    Authentication and organisation-management endpoints for HDS 2.0.
    All protected endpoints require a Bearer JWT access token.
    Errors follow RFC 9457 problem-details with a stable machine-readable `code` field.
    Timestamps are ISO 8601 in UTC; clients render in the site's or org's timezone.
    Writes that can be safely retried accept an `Idempotency-Key` header.

servers:
  - url: /api/v1

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:

    # ── Primitives ───────────────────────────────────────────────────────────

    UUIDv4:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    ISODateTime:
      type: string
      format: date-time
      description: ISO 8601 timestamp in UTC (Z suffix).
      example: "2026-11-01T10:00:00Z"

    ISODate:
      type: string
      format: date
      example: "2026-11-01"

    MoneyAmount:
      type: string
      format: decimal
      description: >
        Exact decimal string representation (e.g. "125.5000"). Never a float.
        Stored as NUMERIC(12,4) in the database.
      example: "125.5000"

    IANATimezone:
      type: string
      description: IANA timezone identifier.
      example: "Asia/Jerusalem"

    UserRole:
      type: string
      enum: [employee, manager, admin, client]

    ProjectType:
      type: string
      enum: [security, training]

    ProjectStatus:
      type: string
      enum: [active, ended]

    # ── Problem Details (RFC 9457) ───────────────────────────────────────────

    ProblemDetail:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: "about:blank"
        title:
          type: string
          example: "Unauthorized"
        status:
          type: integer
          example: 401
        detail:
          type: string
          example: "Invalid or expired access token."
        code:
          type: string
          description: Stable machine-readable error code.
          example: "auth.token_invalid"
        instance:
          type: string
          format: uri

    # ── Auth ─────────────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Access token TTL in seconds (≤ 900).
          example: 900
        refresh_token:
          type: string
          description: Opaque rotating refresh token.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    # ── Organisation ──────────────────────────────────────────────────────────

    OrganisationRead:
      type: object
      required: [id, name, timezone, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        timezone:
          $ref: "#/components/schemas/IANATimezone"
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    # ── Users / Employees ─────────────────────────────────────────────────────

    UserRead:
      type: object
      required: [id, organization_id, email, full_name, role, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/UserRole"
        is_active:
          type: boolean
        default_hourly_rate:
          $ref: "#/components/schemas/MoneyAmount"
          nullable: true
          description: Visible to Managers/Admins and the user themselves (read-only for employees).
        client_id:
          $ref: "#/components/schemas/UUIDv4"
          nullable: true
          description: Non-null only for role=client.
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ClientUserRead:
      type: object
      description: A client-portal user. Carries no role or rate fields.
      required: [id, organization_id, email, full_name, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        client_id:
          $ref: "#/components/schemas/UUIDv4"
          nullable: true
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    UserCreateRequest:
      type: object
      required: [email, full_name, role, initial_password]
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: string
          maxLength: 32
        role:
          $ref: "#/components/schemas/UserRole"
        default_hourly_rate:
          $ref: "#/components/schemas/MoneyAmount"
          nullable: true
        client_id:
          $ref: "#/components/schemas/UUIDv4"
          nullable: true
          description: Required when role=client.
        initial_password:
          type: string
          minLength: 12
          writeOnly: true
          description: Initial password supplied by the Manager (Proposed; min 12 characters).

    ProfileUpdate:
      type: object
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: [string, "null"]
          maxLength: 32

    UserUpdateRequest:
      type: object
      additionalProperties: false
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        phone:
          type: [string, "null"]
          maxLength: 32
        role:
          $ref: "#/components/schemas/UserRole"
        default_hourly_rate:
          anyOf:
            - $ref: "#/components/schemas/MoneyAmount"
            - type: "null"

    UserListResponse:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserRead"
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when exhausted.
        total:
          type: integer
          description: Total matching records (ignoring pagination).

    # ── Groups ────────────────────────────────────────────────────────────────

    GroupRead:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    GroupWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    GroupRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    GroupListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupRead"

    IDListRequest:
      type: object
      required: [ids]
      description: Full-replacement list of UUIDs (used for group/qualification assignments).
      properties:
        ids:
          type: array
          items:
            $ref: "#/components/schemas/UUIDv4"
          uniqueItems: true

    # ── Qualifications ────────────────────────────────────────────────────────

    QualificationRead:
      type: object
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    QualificationWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    QualificationRenameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255

    QualificationListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualificationRead"

    # ── Clients ───────────────────────────────────────────────────────────────

    ClientRead:
      type: object
      required: [id, organization_id, name, contract_start, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        contact_name:
          type: string
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        contact_phone:
          type: string
          nullable: true
        contract_start:
          $ref: "#/components/schemas/ISODate"
        contract_end:
          $ref: "#/components/schemas/ISODate"
          nullable: true
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ClientCreateRequest:
      type: object
      required: [name, contract_start]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
          maxLength: 32
        contract_start:
          $ref: "#/components/schemas/ISODate"
        contract_end:
          $ref: "#/components/schemas/ISODate"
          nullable: true

    ClientUpdateRequest:
      type: object
      additionalProperties: false
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        contact_name:
          type: [string, "null"]
        contact_email:
          type: [string, "null"]
          format: email
        contact_phone:
          type: [string, "null"]
          maxLength: 32
        contract_start:
          $ref: "#/components/schemas/ISODate"
          description: >-
            Cannot be cleared. If either date changes, the end may not precede the start, judged
            on the pair after the change with the stored value of a date not sent (422
            clients.date_range_invalid). A pair sent back unchanged is not judged.
        contract_end:
          anyOf:
            - $ref: "#/components/schemas/ISODate"
            - type: "null"
        is_active:
          type: boolean

    ClientListResponse:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClientRead"
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer

    # ── Sites ─────────────────────────────────────────────────────────────────

    SiteRead:
      type: object
      required: [id, organization_id, name, address, timezone, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        address:
          type: string
        timezone:
          $ref: "#/components/schemas/IANATimezone"
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    SiteCreateRequest:
      type: object
      required: [name, address, timezone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
        timezone:
          $ref: "#/components/schemas/IANATimezone"

    SiteUpdateRequest:
      type: object
      additionalProperties: false
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        name:
          type: string
        address:
          type: string
        timezone:
          $ref: "#/components/schemas/IANATimezone"

    SiteListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteRead"

    # ── Projects ──────────────────────────────────────────────────────────────

    ProjectRead:
      type: object
      required: [id, organization_id, client_id, site_id, name, type, billing_rate, start_date, status, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        organization_id:
          $ref: "#/components/schemas/UUIDv4"
        client_id:
          $ref: "#/components/schemas/UUIDv4"
        site_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        type:
          $ref: "#/components/schemas/ProjectType"
        billing_rate:
          $ref: "#/components/schemas/MoneyAmount"
        start_date:
          $ref: "#/components/schemas/ISODate"
        end_date:
          $ref: "#/components/schemas/ISODate"
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ProjectCreateRequest:
      type: object
      required: [client_id, site_id, name, type, billing_rate, start_date]
      properties:
        client_id:
          $ref: "#/components/schemas/UUIDv4"
        site_id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: "#/components/schemas/ProjectType"
        billing_rate:
          $ref: "#/components/schemas/MoneyAmount"
        start_date:
          $ref: "#/components/schemas/ISODate"
        end_date:
          $ref: "#/components/schemas/ISODate"
          nullable: true

    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      description: PATCH — all fields optional; null clears a field that allows it.
      properties:
        name:
          type: string
        billing_rate:
          $ref: "#/components/schemas/MoneyAmount"
        end_date:
          anyOf:
            - $ref: "#/components/schemas/ISODate"
            - type: "null"
        status:
          $ref: "#/components/schemas/ProjectStatus"

    ProjectListResponse:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRead"
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer

  # ── Reusable parameters ───────────────────────────────────────────────────
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional UUID for safe retries on POST endpoints.

    # ── Availability (003 Part 2) ─────────────────────────────────────────────

    WindowRead:
      type: object
      required: [id, starts_on, ends_on, deadline, is_open]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        starts_on:
          $ref: "#/components/schemas/ISODate"
        ends_on:
          $ref: "#/components/schemas/ISODate"
        deadline:
          $ref: "#/components/schemas/ISODateTime"
        is_open:
          type: boolean
          description: True while now is before the deadline.

    WindowListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WindowRead"

    WindowCreateRequest:
      type: object
      required: [starts_on, ends_on, deadline]
      description: >-
        A period of dates (inclusive) and its deadline. It may not end before it starts (422
        windows.date_range_invalid) or share a date with another window (409 windows.overlap).
      properties:
        starts_on:
          $ref: "#/components/schemas/ISODate"
        ends_on:
          $ref: "#/components/schemas/ISODate"
        deadline:
          $ref: "#/components/schemas/ISODateTime"

    WindowUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        deadline:
          $ref: "#/components/schemas/ISODateTime"

    EntryRead:
      type: object
      required: [id, user_id, kind, absence_kind, starts_on, ends_on, shift_type_id, weekday, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        user_id:
          $ref: "#/components/schemas/UUIDv4"
        kind:
          type: string
          enum: [blocked, open, close, absence]
        absence_kind:
          type: [string, "null"]
          enum: [leave, reserve_duty, sick, null]
        starts_on:
          $ref: "#/components/schemas/ISODate"
        ends_on:
          $ref: "#/components/schemas/ISODate"
        shift_type_id:
          anyOf:
            - $ref: "#/components/schemas/UUIDv4"
            - type: "null"
        weekday:
          type: [integer, "null"]
          minimum: 0
          maximum: 6
          description: 0 Sunday to 6 Saturday.
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    EntryListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntryRead"

    EntryCreateRequest:
      type: object
      required: [kind, starts_on, ends_on]
      description: >-
        An absence has an absence_kind and no shift type or weekday; other kinds have no
        absence_kind and may be limited to one shift type and one weekday. An employee may add one
        only for dates in an open window, except an absence; an Admin at any time.
      properties:
        kind:
          type: string
          enum: [blocked, open, close, absence]
        absence_kind:
          type: [string, "null"]
          enum: [leave, reserve_duty, sick, null]
        starts_on:
          $ref: "#/components/schemas/ISODate"
        ends_on:
          $ref: "#/components/schemas/ISODate"
        shift_type_id:
          anyOf:
            - $ref: "#/components/schemas/UUIDv4"
            - type: "null"
        weekday:
          type: [integer, "null"]
          minimum: 0
          maximum: 6

    EntryUpdateRequest:
      type: object
      additionalProperties: false
      description: PATCH; null clears absence_kind, shift_type_id or weekday.
      properties:
        kind:
          type: string
          enum: [blocked, open, close, absence]
        absence_kind:
          type: [string, "null"]
          enum: [leave, reserve_duty, sick, null]
        starts_on:
          $ref: "#/components/schemas/ISODate"
        ends_on:
          $ref: "#/components/schemas/ISODate"
        shift_type_id:
          anyOf:
            - $ref: "#/components/schemas/UUIDv4"
            - type: "null"
        weekday:
          type: [integer, "null"]
          minimum: 0
          maximum: 6

    # ── Shift types (003 Part 2) ──────────────────────────────────────────────

    LocalTime:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
      description: A time of day, HH:MM or HH:MM:SS, local to the site a shift is at; no UTC offset.
      example: "07:00"

    ShiftTypeRead:
      type: object
      required: [id, name, starts_at_local, ends_at_local, crosses_midnight, is_active, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string
        starts_at_local:
          $ref: "#/components/schemas/LocalTime"
        ends_at_local:
          $ref: "#/components/schemas/LocalTime"
        crosses_midnight:
          type: boolean
          description: True exactly when the end is not after the start; computed, never sent.
        is_active:
          type: boolean
        created_at:
          $ref: "#/components/schemas/ISODateTime"
        updated_at:
          $ref: "#/components/schemas/ISODateTime"

    ShiftTypeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShiftTypeRead"

    ShiftTypeCreateRequest:
      type: object
      required: [name, starts_at_local, ends_at_local]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        starts_at_local:
          $ref: "#/components/schemas/LocalTime"
        ends_at_local:
          $ref: "#/components/schemas/LocalTime"

    ShiftTypeUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        starts_at_local:
          $ref: "#/components/schemas/LocalTime"
        ends_at_local:
          $ref: "#/components/schemas/LocalTime"
        is_active:
          type: boolean
          description: False retires the type; shifts already made from it stay.

    ShiftTypeIdsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            $ref: "#/components/schemas/UUIDv4"

    # ── Staffing needs and scheduling limits (004) ──────────────────────────

    NeedItem:
      type: object
      additionalProperties: false
      required: [shift_type_id, weekday, headcount]
      properties:
        shift_type_id:
          $ref: "#/components/schemas/UUIDv4"
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 Sunday to 6 Saturday.
        headcount:
          type: integer
          minimum: 1
          maximum: 999

    NeedsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NeedItem"

    NeedsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NeedItem"

    SchedulingSettings:
      type: object
      required: [min_rest_hours, max_weekly_hours]
      properties:
        min_rest_hours:
          type: integer
        max_weekly_hours:
          type: integer

    SchedulingSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        min_rest_hours:
          type: integer
          minimum: 1
          maximum: 24
        max_weekly_hours:
          type: integer
          minimum: 1
          maximum: 168

    # ── Schedule jobs (004) ──────────────────────────────────────────────────

    JobCreateRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/ISODate"
        to:
          $ref: "#/components/schemas/ISODate"
        project_ids:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/UUIDv4"
        solver:
          type: string
          enum: [greedy, cpsat]
          default: cpsat

    JobSummary:
      type: object
      required: [id, status, from, to, project_ids, solver, requested_by, settings, created_at]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        from:
          $ref: "#/components/schemas/ISODate"
        to:
          $ref: "#/components/schemas/ISODate"
        project_ids:
          type: array
          items:
            $ref: "#/components/schemas/UUIDv4"
        solver:
          type: string
        requested_by:
          $ref: "#/components/schemas/UUIDv4"
        settings:
          $ref: "#/components/schemas/SchedulingSettings"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        error_code:
          type: string
          nullable: true
          description: jobs.solver_failed or jobs.worker_lost when failed.
        optimal:
          type: boolean
          nullable: true
        proposal_state:
          type: string
          nullable: true
          enum: [open, accepted, discarded, expired]

    JobRead:
      allOf:
        - $ref: "#/components/schemas/JobSummary"
        - type: object
          properties:
            proposal:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/Proposal"

    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobSummary"
        next_cursor:
          type: string
          nullable: true

    Proposal:
      type: object
      description: Who works each slot, what stays empty and why, and what it changes; employees by id only.
      required: [slots, unfilled, employees, no_availability, short_published, changes]
      properties:
        slots:
          type: array
          items:
            type: object
            required: [key, project_id, shift_type_id, date, starts_at, ends_at, headcount, assigned, kept]
            properties:
              key: {type: string}
              shift_id: {type: string, format: uuid, nullable: true}
              project_id: {$ref: "#/components/schemas/UUIDv4"}
              shift_type_id: {$ref: "#/components/schemas/UUIDv4"}
              date: {$ref: "#/components/schemas/ISODate"}
              starts_at: {type: string, format: date-time}
              ends_at: {type: string, format: date-time}
              headcount: {type: integer}
              assigned: {type: array, items: {$ref: "#/components/schemas/UUIDv4"}}
              kept: {type: array, items: {$ref: "#/components/schemas/UUIDv4"}}
        unfilled:
          type: array
          items:
            type: object
            required: [key, places, reasons]
            properties:
              key: {type: string}
              places: {type: integer}
              reasons:
                type: array
                items:
                  type: object
                  required: [code, employees]
                  properties:
                    code:
                      type: string
                      enum: [schedule.unavailable, schedule.overlap, schedule.minimum_rest, schedule.weekly_maximum, schedule.needed_elsewhere, schedule.no_active_employee]
                    employees: {type: integer}
        employees:
          type: array
          items:
            type: object
            required: [user_id, minutes, nights, open_met, close_not_met]
            properties:
              user_id: {$ref: "#/components/schemas/UUIDv4"}
              minutes: {type: integer}
              nights: {type: integer}
              open_met: {type: integer}
              close_not_met: {type: integer}
        no_availability:
          type: array
          items: {$ref: "#/components/schemas/UUIDv4"}
        short_published:
          type: array
          items:
            type: object
            required: [shift_id, needed, assigned]
            properties:
              shift_id: {$ref: "#/components/schemas/UUIDv4"}
              needed: {type: integer}
              assigned: {type: integer}
        changes:
          type: object
          required: [added, removed]
          properties:
            added:
              type: array
              items: {type: object, required: [key, user_id], properties: {key: {type: string}, user_id: {$ref: "#/components/schemas/UUIDv4"}}}
            removed:
              type: array
              items: {type: object, required: [key, user_id], properties: {key: {type: string}, user_id: {$ref: "#/components/schemas/UUIDv4"}}}

    # ── Manual roster (003 Part 2) ────────────────────────────────────────────

    Money:
      type: string
      pattern: "^(?!0+(\\.0+)?$)\\d{1,8}(\\.\\d{1,4})?$"
      description: A positive decimal string, never a JSON number.
      example: "75.0000"

    AssignmentRead:
      type: object
      required: [id, shift_id, user_id]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        shift_id:
          $ref: "#/components/schemas/UUIDv4"
        user_id:
          $ref: "#/components/schemas/UUIDv4"

    ShiftRead:
      type: object
      required: [id, project_id, shift_type_id, starts_at, ends_at, timezone, headcount, pay_rate, status, published_at, assignments]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        project_id:
          $ref: "#/components/schemas/UUIDv4"
        shift_type_id:
          $ref: "#/components/schemas/UUIDv4"
        starts_at:
          $ref: "#/components/schemas/ISODateTime"
        ends_at:
          $ref: "#/components/schemas/ISODateTime"
        timezone:
          type: string
          description: The IANA time zone of the project's site.
        headcount:
          type: integer
          minimum: 1
        pay_rate:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        status:
          type: string
          enum: [draft, published]
        published_at:
          anyOf:
            - $ref: "#/components/schemas/ISODateTime"
            - type: "null"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentRead"

    RuleWarning:
      type: object
      required: [code, employee_id, shift_ids, detail]
      description: A rule a change breaks; the change was stored anyway (003 FR-116).
      properties:
        code:
          type: string
          enum: [warnings.overlap, warnings.rest_too_short, warnings.weekly_hours_exceeded, warnings.blocked, warnings.absence, warnings.close_preference, warnings.over_headcount, warnings.under_headcount, warnings.employee_inactive]
        employee_id:
          anyOf:
            - $ref: "#/components/schemas/UUIDv4"
            - type: "null"
        shift_ids:
          type: array
          items:
            $ref: "#/components/schemas/UUIDv4"
        detail:
          type: string

    ShiftAnswer:
      type: object
      required: [shift, warnings]
      properties:
        shift:
          $ref: "#/components/schemas/ShiftRead"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/RuleWarning"

    AssignmentAnswer:
      type: object
      required: [assignment, warnings]
      properties:
        assignment:
          $ref: "#/components/schemas/AssignmentRead"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/RuleWarning"

    WarningsAnswer:
      type: object
      required: [warnings]
      properties:
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/RuleWarning"

    ShiftPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShiftRead"
        next_cursor:
          type: [string, "null"]

    ShiftCreateRequest:
      type: object
      required: [project_id, shift_type_id, date]
      description: >-
        Times are the shift type's local times on the date at the project's site, unless starts_at
        and ends_at are both given (422 shifts.times_invalid if only one is, or they do not end after
        they start). The project must use the type (422 shifts.type_not_in_project).
      properties:
        project_id:
          $ref: "#/components/schemas/UUIDv4"
        shift_type_id:
          $ref: "#/components/schemas/UUIDv4"
        date:
          $ref: "#/components/schemas/ISODate"
        headcount:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        pay_rate:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        starts_at:
          anyOf:
            - $ref: "#/components/schemas/ISODateTime"
            - type: "null"
        ends_at:
          anyOf:
            - $ref: "#/components/schemas/ISODateTime"
            - type: "null"

    ShiftUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        starts_at:
          $ref: "#/components/schemas/ISODateTime"
        ends_at:
          $ref: "#/components/schemas/ISODateTime"
        headcount:
          type: integer
          minimum: 1
          maximum: 1000
        pay_rate:
          anyOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"

    AssignRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          $ref: "#/components/schemas/UUIDv4"

    # ── Publishing and my shifts (003 Part 2) ─────────────────────────────────

    PublishRequest:
      type: object
      required: [from, to]
      description: Dates at the project's site; to may not be before from (422 shifts.date_range_invalid).
      properties:
        from:
          $ref: "#/components/schemas/ISODate"
        to:
          $ref: "#/components/schemas/ISODate"

    PublishAnswer:
      type: object
      required: [published]
      properties:
        published:
          type: integer
          description: How many drafts were published.

    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        name:
          type: string

    MyShift:
      type: object
      required: [id, starts_at, ends_at, timezone, shift_type, project, site]
      description: One of the caller's own published shifts; nothing about anyone else on it.
      properties:
        id:
          $ref: "#/components/schemas/UUIDv4"
        starts_at:
          $ref: "#/components/schemas/ISODateTime"
        ends_at:
          $ref: "#/components/schemas/ISODateTime"
        timezone:
          type: string
          description: The IANA time zone of the site.
        shift_type:
          type: string
        project:
          $ref: "#/components/schemas/NamedRef"
        site:
          $ref: "#/components/schemas/NamedRef"

    MyShiftList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyShift"

  # ── Reusable responses ────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Forbidden:
      description: Authenticated but insufficient role or data scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found (or hidden by soft delete / scope filter).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: Uniqueness conflict (e.g. duplicate email within the organisation).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnprocessableEntity:
      description: Validation error (invalid field values).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadRequest:
      description: The request body could not be parsed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    TooManyRequests:
      description: Too many failed sign-ins from this network.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ServiceBusy:
      description: The password-hashing queue is full; nothing was changed.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

# ---------------------------------------------------------------------------
# Global security (overridden on public auth endpoints)
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      operationId: auth_login
      summary: Sign in with email and password
      tags: [Auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful sign-in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Unauthorized"
                status: 401
                code: "auth.invalid_credentials"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "423":
          description: Account locked due to too many failed attempts.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Locked"
                status: 423
                detail: "Account locked for 15 minutes. Contact your manager if urgent."
                code: "auth.account_locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /auth/refresh:
    post:
      operationId: auth_refresh
      summary: Exchange a refresh token for a new access token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token issued; old refresh token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/logout:
    post:
      operationId: auth_logout
      summary: Sign out (invalidate current refresh token)
      tags: [Auth]
      responses:
        "204":
          description: Session invalidated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/logout-all:
    post:
      operationId: auth_logout_all
      summary: Sign out of all devices (invalidate all refresh tokens)
      tags: [Auth]
      responses:
        "204":
          description: All sessions invalidated.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/invite:
    post:
      operationId: auth_invite
      summary: Invite a user by email (Manager+)
      description: >
        Always answers 202 with an empty body. The invitation token is delivered only by email.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/UserRole"
      responses:
        "202":
          description: Invitation accepted for delivery.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /auth/invite/accept:
    post:
      operationId: auth_invite_accept
      summary: Accept an invitation and set a password
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
                  writeOnly: true
      responses:
        "204":
          description: Account activated; the user can now sign in.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Token invalid, expired or already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /auth/password-reset/request:
    post:
      operationId: auth_password_reset_request
      summary: Request a password-reset email
      description: >
        Always answers 202 with an empty body, whether or not the email is known and whether or
        not a limit is reached. The request only counts and answers: the account is looked at and
        the email sent after the response, so a failure there is not reported. Earlier links keep
        working until one is redeemed, which cancels the rest. Requests are limited per address
        and per network in a 60-minute window; over a limit nothing is issued or sent.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Request accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm
      summary: Set a new password using a reset token
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  writeOnly: true
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Token invalid, expired or already used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  # ── Current user (self) ───────────────────────────────────────────────────

  /me:
    get:
      operationId: me_get
      summary: Get the current user's profile
      tags: [Me]
      responses:
        "200":
          description: Current user's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      operationId: me_update
      summary: Update the current user's own profile (name and phone only)
      tags: [Me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Employees ─────────────────────────────────────────────────────────────

  /employees:
    get:
      operationId: employees_list
      summary: List employees (Manager+)
      tags: [Employees]
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Full-name or email search.
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/UserRole"
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: group_id
          in: query
          schema:
            $ref: "#/components/schemas/UUIDv4"
        - name: qualification_id
          in: query
          schema:
            $ref: "#/components/schemas/UUIDv4"
      responses:
        "200":
          description: Paginated employee list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    post:
      operationId: employees_create
      summary: Create a new employee (Manager+)
      tags: [Employees]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Employee created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"

  /employees/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv4"

    get:
      operationId: employees_get
      summary: Get an employee by ID (Manager+, or self)
      tags: [Employees]
      responses:
        "200":
          description: Employee record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    patch:
      operationId: employees_update
      summary: Update an employee (Manager+ or self with restricted fields)
      tags: [Employees]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated employee record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: employees_delete
      summary: Soft-delete an employee record (Admin only)
      tags: [Employees]
      responses:
        "204":
          description: Employee hidden (soft-deleted); history preserved.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /employees/{id}/deactivate:
    post:
      operationId: employees_deactivate
      summary: Deactivate an employee (Manager+)
      tags: [Employees]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUIDv4"
      responses:
        "200":
          description: Employee deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot deactivate the last active Admin.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                code: "users.last_admin"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /employees/{id}/reactivate:
    post:
      operationId: employees_reactivate
      summary: Reactivate a deactivated employee (Manager+)
      tags: [Employees]
      parameters:
        - name: id
          in: path
          required: true
