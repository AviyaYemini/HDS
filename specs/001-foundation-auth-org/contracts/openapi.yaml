        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Pay to date (005) ──────────────────────────────────────────────────────
  /me/pay:

    get:
      operationId: my_pay_read
      summary: Read my pay so far this month (Employee, Manager, Admin)
      description: >
        The caller's gross pay, before tax, for a month (YYYY-MM, the current one by default):
        each published shift that has ended, with its hours at each rate and its pay, and the
        totals. Draft shifts and shifts not yet ended are not counted; a shift belongs to the
        month it starts in at its site. 422 pay.month_invalid.
      tags: [PaySettings]
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: "^([1-9][0-9]{3}|0[1-9][0-9]{2}|00[1-9][0-9]|000[1-9])-(0[1-9]|1[0-2])$"
      responses:
        "200":
          description: The caller's pay to date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayToDate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Reports (005) ──────────────────────────────────────────────────────────
  /reports/work-log:

    get:
      operationId: reports_work_log
      summary: Who worked at a project, site or group (Manager+)
      description: >
        Each person once per project with shift count, hours, and first and last date, for
        exactly one of project_id, site_id, group_id (422 reports.scope_invalid). For a project
        the range starts on its start date unless from is given; a site or group needs from (422
        reports.start_required); to is today by default; at most 366 days (422
        reports.range_invalid). Only published shifts that have ended count; no pay.
      tags: [Reports]
      parameters:
        - name: project_id
          in: query
          required: false
          schema: {$ref: "#/components/schemas/UUIDv4"}
        - name: site_id
          in: query
          required: false
          schema: {$ref: "#/components/schemas/UUIDv4"}
        - name: group_id
          in: query
          required: false
          schema: {$ref: "#/components/schemas/UUIDv4"}
        - name: from
          in: query
          required: false
          schema: {$ref: "#/components/schemas/ISODate"}
        - name: to
          in: query
          required: false
          schema: {$ref: "#/components/schemas/ISODate"}
      responses:
        "200":
          description: The work-log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /reports/hours:

    get:
      operationId: reports_hours
      summary: Hours and pay per employee or project (Manager+)
      description: >
        Hours and shift counts from from to to (at most 366 days, 422 reports.range_invalid),
        grouped by employee or project. An Admin sees pay for every project with pay on; a
        Manager only for projects they are assigned to whose pay is open to Managers. Elsewhere
        there is no pay figure at all.
      tags: [Reports]
      parameters:
        - name: from
          in: query
          required: true
          schema: {$ref: "#/components/schemas/ISODate"}
        - name: to
          in: query
          required: true
          schema: {$ref: "#/components/schemas/ISODate"}
        - name: group_by
          in: query
          required: true
          schema: {type: string, enum: [employee, project]}
      responses:
        "200":
          description: The hours report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoursReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
