  # ── Schedule jobs (004) ──────────────────────────────────────────────────
  /schedule-jobs:

    post:
      operationId: schedule_jobs_create
      summary: Ask for a roster (Manager+)
      description: >
        Queues a run that proposes a roster for from to to (at most 31 days) over every active
        project, or the project_ids given. A worker solves it; nothing in the roster changes
        until the proposal is accepted. 422 schedule.range_invalid, schedule.project_not_active;
        with an Idempotency-Key, a repeat answers the first job and the same key with another
        request is 422 idempotency.key_reused.
      tags: [ScheduleJobs]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreateRequest"
      responses:
        "202":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    get:
      operationId: schedule_jobs_list
      summary: List schedule jobs (Manager+)
      tags: [ScheduleJobs]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, running, succeeded, failed]
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The organisation's jobs, newest first, without proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /schedule-jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv4"

    get:
      operationId: schedule_jobs_read
      summary: Read a schedule job and its proposal (Manager+)
      tags: [ScheduleJobs]
      responses:
        "200":
          description: The job and, once it has succeeded, its proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /schedule-jobs/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv4"

    post:
      operationId: schedule_jobs_accept
      summary: Accept a proposal as drafts (Manager+)
      description: >
        Stores the proposal as draft shifts and assignments, all or nothing; nothing is
        published. 409 schedule.not_ready, schedule.proposal_closed, schedule.proposal_out_of_date.
      tags: [ScheduleJobs]
      responses:
        "200":
          description: What was written.
          content:
            application/json:
              schema:
                type: object
                required: [shifts_created, shifts_updated, assignments_added, assignments_removed]
                properties:
                  shifts_created: {type: integer}
                  shifts_updated: {type: integer}
                  assignments_added: {type: integer}
                  assignments_removed: {type: integer}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /schedule-jobs/{id}/discard:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv4"

    post:
      operationId: schedule_jobs_discard
      summary: Discard a proposal (Manager+)
      description: Closes the proposal without storing it. 409 schedule.not_ready, schedule.proposal_closed.
      tags: [ScheduleJobs]
      responses:
        "200":
          description: The job, its proposal now discarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

