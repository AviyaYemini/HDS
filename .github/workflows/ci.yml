name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run ruff check src/ tests/
        working-directory: apps/api
      - run: uv run ruff format --check src/ tests/
        working-directory: apps/api
      # The API image runs as non-root and carries its version (specs/006 T005).
      - run: infra/tests/check_api_image.sh
      # make ops-backup and ops-restore-test, against a fake kubectl (specs/006 T045b).
      - run: infra/tests/check_backup_jobs.sh
      # make ops-rollback and ops-resume against fake flux, helm and kubectl; the release's scripts
      # and workflow, without GitHub or a registry (specs/006 T046 to T049).
      - run: infra/tests/check_deploy_ops.sh
      - run: infra/tests/check_release.sh
      # make ops-status against a fake kubectl and helm (T057).
      - run: infra/tests/check_status.sh
      # The operations scripts, POSIX sh (specs/006). Version as infra/VERSIONS.md.
      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -x \
            scripts/ops/*.sh infra/tests/*.sh infra/helm/tests/*.sh infra/backup/*.sh \
            infra/backup/tests/*.sh infra/release/*.sh
      # The workflows (specs/006 T047). Version as infra/VERSIONS.md.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -no-color -oneline

  chart:
    name: Helm charts (lint, kubeconform, rendered-manifest checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so chart_version.sh finds the merge base with the target branch.
          fetch-depth: 0
      # The three charts (hds for values-local.yaml and values-ci.yaml, hds-postgres, hds-secrets),
      # Vault's and the operator's charts with infra/cluster's values, and Flux's files (specs/006
      # T033, T048, T051, T052). Helm, kubeconform and yq run from images pinned in
      # infra/VERSIONS.md.
      - run: infra/helm/tests/assert.sh
      # A pull request that changes a fixed-version chart raises its version (T047, reviews
      # R98, R135).
      - if: github.event_name == 'pull_request'
        run: infra/helm/tests/chart_version.sh "origin/$GITHUB_BASE_REF"
      # Vault's policies and roles, as scripts/ops/vault_configure.sh writes them, against a dev
      # Vault of the cluster's version (T052).
      - run: infra/tests/check_vault_policy.sh
      # The alert rules with promtool, and Alertmanager's configuration and e-mails with amtool,
      # both of the cluster's versions (T055, T056).
      - run: infra/tests/check_alerts.sh
      - run: infra/tests/check_alertmanager.sh

  backup-restore:
    name: Backups and the restore test (compose, encrypted folder remotes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # A backup to both places, nothing readable stored, the restore test from the offsite copy,
      # its failures (row counts, revision, checksum), an unreachable offsite, pruning and a
      # guarded restore (specs/006 T038, FR-011 to FR-014). Passwords are made for the run.
      - run: infra/backup/tests/run.sh

  quickstart:
    name: Quickstart from a clean checkout (make env, make up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The versions, so a failure in the steps below shows which Docker and Compose built it.
      - run: docker version && docker compose version
      # The whole local environment from nothing, as the README says, then restart, wipe, a taken
      # port and a failing migration (specs/006 FR-001 to FR-005, SC-001). It wipes the database,
      # which on a runner is a throwaway one.
      - run: scripts/ops/quickstart_check.sh
        env:
          QUICKSTART_THROWAWAY: "1"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans only the commits this run adds: a pull request's own commits, or a push's. A secret
      # anywhere in them fails the job, naming the file and line (specs/006 FR-025). The image is
      # pinned in infra/VERSIONS.md; .gitleaks.toml lists the made-up test values it may ignore.
      - name: gitleaks
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch's push has an all-zero "before", and after a force-push "before" is no
          # longer in the history; then scan the pushed commit alone rather than fail on a bad range.
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            range="${BASE}..${HEAD_SHA}"
          else
            range="-1 ${HEAD_SHA}"
          fi
          echo "Scanning: $range"
          # Run as the checkout's owner, or git refuses the mounted repository as unsafe.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --verbose --log-opts="$range" .

  docstrings:
    name: Docstring coverage (interrogate, Constitution XI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run interrogate src/
        working-directory: apps/api

  markdown-links:
    name: Markdown link check (Constitution XI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Offline mode checks relative links and anchors only, so the job stays deterministic
      # and does not fail when a third-party site is down.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run pip-audit
        working-directory: apps/api

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  typecheck:
    name: Type check (mypy --strict, src and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run mypy --strict src/ tests/
        working-directory: apps/api

  import-graph:
    name: Import graph (Constitution II)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run python -m hds.tools.check_imports
        working-directory: apps/api

  test-unit:
    name: Unit and property tests (SQLite)
    runs-on: ubuntu-latest
    env:
      # The settings need an explicit environment and secret (specs/002-security-hardening).
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      # Examples per generation property (004 SC-002); 200 locally.
      HDS_GENERATE_EXAMPLES: "1000"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      # tests/property holds the Hypothesis tests of the scheduling package (Constitution IV).
      - run: uv run pytest tests/unit/ tests/property/ -v --tb=short
        working-directory: apps/api

  # Whether a pull request touches what the database jobs test: the API (code, tests, migrations,
  # pyproject.toml, uv.lock), the OpenAPI contract its tests and the drift check read, or this
  # workflow. Those jobs skip otherwise, by a job-level `if:`, so their checks show as Skipped and
  # still pass; a workflow-level `paths` filter would leave required checks pending forever. A push
  # to main always runs everything: the Release workflow publishes only after CI passes there. Keep
  # this job a required check, or a failure here would skip the database jobs unnoticed.
  changes:
    name: Changed paths (API, contract or CI)
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
      deploy: ${{ steps.diff.outputs.deploy }}
      compat: ${{ steps.diff.outputs.compat }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only a pull request can skip, and only when git can tell: a failed diff runs everything.
          api=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && changed=$(git diff --name-only \
            "$BASE...$HEAD_SHA" -- apps/api/ specs/001-foundation-auth-org/contracts/openapi.yaml \
            .github/workflows/ci.yml); then
            printf '%s\n' "$changed"
            [ -n "$changed" ] || api=false
          fi
          echo "api=$api" | tee -a "$GITHUB_OUTPUT"
          # What a rolling update must prove (specs/006 T059): the code, the charts, the cluster's
          # shape, and the proof itself. Not apps/api alone: a chart-only change (probes, strategy,
          # the PDB, the NetworkPolicies) is exactly what it checks.
          deploy=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && changed=$(git diff --name-only \
            "$BASE...$HEAD_SHA" -- apps/ infra/helm/ infra/cluster/k3d.yaml \
            infra/cluster/backup-pvc.yaml 'infra/Dockerfile.*' infra/backup/ infra/web/ \
            scripts/ops/status.sh infra/tests/rolling_update.sh infra/tests/rolling-update-values.yaml \
            infra/tests/load.py infra/tests/flux_verify.sh .github/workflows/ci.yml); then
            [ -n "$changed" ] || deploy=false
          fi
          echo "deploy=$deploy" | tee -a "$GITHUB_OUTPUT"
          # The compatibility check (specs/006 T061): the API's paths, as above, and its own script
          # (review R198), without widening `api`, which the database jobs read.
          compat=$api
          if [ "$compat" = false ] && changed=$(git diff --name-only "$BASE...$HEAD_SHA" -- \
            infra/tests/compat.sh); then
            [ -z "$changed" ] || compat=true
          fi
          echo "compat=$compat" | tee -a "$GITHUB_OUTPUT"

  # The integration, contract and concurrency suites in five shards at once, each on a PostgreSQL of
  # its own: one after another they took about 34 minutes. The split follows CI's timings (6 to 7.5
  # minutes of tests each), and together the shards run exactly the tests the one job ran. The
  # integration files split by the letter after `test_`; the third shard takes every name the first
  # two do not, so a new file always runs, and the result job below fails on a test file outside
  # them. Rebalance by moving letters, keeping the third shard the complement of the first two.
  test-integration:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        include:
          - name: Integration tests 1 of 3 (PostgreSQL 16)
            tests: "tests/integration/test_[a-c]*.py"
          - name: Integration tests 2 of 3 (PostgreSQL 16)
            tests: "tests/integration/test_[d-o]*.py"
          - name: Integration tests 3 of 3 (PostgreSQL 16)
            tests: "tests/integration/test_[!a-o]*.py"
          - name: Contract tests in pytest (PostgreSQL 16)
            tests: tests/contract/
          # tests/concurrency needs real parallelism on PostgreSQL, so it runs here; the single-use
          # and last-Admin guarantees would otherwise have no automated guard.
          - name: Concurrency tests (PostgreSQL 16)
            tests: tests/concurrency/
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: hds_test
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://hds:hds_test@localhost:5432/hds_test
      # The test suite reads TEST_DATABASE_URL (it must end in "_test"); without it the tests
      # fall back to a local-dev password that does not exist on this service.
      TEST_DATABASE_URL: postgresql+asyncpg://hds:hds_test@localhost:5432/hds_test
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      # Required once the settings stop defaulting to development (specs/002-security-hardening).
      ENVIRONMENT: test
      HDS_SCHEMATHESIS_EXAMPLES: "100"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      # Unquoted, so the shell expands the shard's glob; one that matches nothing fails the run.
      - run: |
          # shellcheck disable=SC2086
          uv run pytest $TESTS -v --tb=short
        working-directory: apps/api
        env:
          TESTS: ${{ matrix.tests }}

  # The one check to require for the shards above. A skipped matrix job reports under another name
  # than its shards, so the shards' own names cannot be required: they would wait forever on a pull
  # request that skips them. This job always runs, and passes only when every shard passed, or when
  # all were skipped because the API did not change.
  test-integration-result:
    name: Integration and contract tests (PostgreSQL 16)
    needs: [changes, test-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The integration shards take top-level tests/integration/test_*.py files by glob, where the
      # one job ran the whole folder. A file pytest would collect anywhere else there, in a
      # subfolder or named *_test.py (pytest's default python_files; pyproject.toml sets none),
      # would run in no shard, so it fails here.
      - name: Every integration test file is in a shard
        run: |
          stray=$(find apps/api/tests/integration -type f \
            \( -name 'test_*.py' -o -name '*_test.py' \) \
            | grep -vE '^apps/api/tests/integration/test_[^/]*\.py$' || true)
          [ -z "$stray" ] && exit 0
          printf '%s\n' "$stray" | while read -r file; do
            echo "::error file=$file::no shard runs it; integration tests are top-level test_*.py"
          done
          exit 1
      - env:
          CHANGES: ${{ needs.changes.result }}
          API: ${{ needs.changes.outputs.api }}
          SHARDS: ${{ needs.test-integration.result }}
        run: |
          echo "changes: $CHANGES (api=$API); shards: $SHARDS"
          [ "$CHANGES" = success ]
          if [ "$API" = true ]; then [ "$SHARDS" = success ]; else [ "$SHARDS" = skipped ]; fi

  migration-check:
    name: Migration check (alembic check)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: hds_check
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_check
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://hds:hds_check@localhost:5432/hds_check
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run alembic check
        working-directory: apps/api

  contract:
    name: Contract tests (Schemathesis)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: hds_scratch
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_scratch
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://hds:hds_scratch@localhost:5432/hds_scratch
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      ENVIRONMENT: test
      # The fuzzer fails sign-ins from one address on purpose; without this the second run in a
      # window could not even sign in.
      LOGIN_RATE_LIMIT_PER_NETWORK: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run python -m hds.scripts.seed_dev
        working-directory: apps/api
      - name: Start API
        run: |
          uv run uvicorn hds.main:app --host 0.0.0.0 --port 8000 &
          curl --retry 30 --retry-connrefused --retry-delay 1 -sf \
            http://localhost:8000/api/v1/openapi.json -o /dev/null
        working-directory: apps/api
      - name: OpenAPI drift check (T124)
        run: |
          curl -sf http://localhost:8000/api/v1/openapi.json -o /tmp/openapi.generated.json
          uv run python -m hds.scripts.export_openapi --check \
            ../../specs/001-foundation-auth-org/contracts/openapi.yaml /tmp/openapi.generated.json
        working-directory: apps/api
      - name: Schemathesis against the running, seeded server (T113)
        run: scripts/contract_cli.sh http://localhost:8000 50
        working-directory: apps/api

  client:
    name: Client (ESLint, tsc, Jest with coverage, generated-client drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile
      # Jest's compiled files; a warm cache keeps the first render of each test file fast.
      - uses: actions/cache@v4
        with:
          path: apps/client/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/client/jest.config.js') }}
      - run: pnpm client:lint
      - run: pnpm client:typecheck
      - run: pnpm client:test
      # Regenerates packages/api-client from the API's OpenAPI document and fails on any
      # difference from the committed copy (Constitution V).
      - run: pnpm api-client:check

  client-e2e:
    name: Client e2e (Playwright on the web build, with the RTL smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: hds_e2e_test
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_e2e
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://hds:hds_e2e@localhost:5432/hds_e2e_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/client
      - run: pnpm e2e
        working-directory: apps/client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/client/playwright-report/

  # The base's release upgraded to the head's on k3d, under signed-in load, with Flux's signature
  # check and the web build on the upgraded cluster (specs/006 T059, FR-017, FR-019, FR-020).
  rolling-update:
    name: Rolling update on k3d (base to head, under load)
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/client
      # The base: the pull request's, or for a push the commit before it (the first commit of a
      # branch has none: its parent then).
      - env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HDS_CLUSTER_SMOKE: cd apps/client && pnpm exec playwright test -c tests/cluster/playwright.cluster.config.ts
        run: |
          base=${PR_BASE:-$BEFORE}
          case $base in "" | 0000000000000000000000000000000000000000) base=$(git rev-parse HEAD~1) ;; esac
          infra/tests/rolling_update.sh "$base"

  # The base's code and integration tests on the head's schema (specs/006 T061, FR-016).
  compatibility:
    name: Old code on the new schema (compatibility)
    needs: changes
    if: needs.changes.outputs.compat == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=${PR_BASE:-$BEFORE}
          case $base in "" | 0000000000000000000000000000000000000000) base=$(git rev-parse HEAD~1) ;; esac
          infra/tests/compat.sh "$base"
