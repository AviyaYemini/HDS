name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run ruff check src/ tests/
        working-directory: apps/api
      - run: uv run ruff format --check src/ tests/
        working-directory: apps/api
      # The API image runs as non-root and carries its version (specs/006 T005).
      - run: infra/tests/check_api_image.sh
      # The operations scripts, POSIX sh (specs/006). Version as infra/VERSIONS.md.
      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/ops/*.sh infra/tests/*.sh infra/helm/tests/*.sh

  chart:
    name: Helm charts (lint, kubeconform, rendered-manifest checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Both charts, hds and hds-postgres, for values-local.yaml and values-ci.yaml (specs/006
      # T033). Helm, kubeconform and yq run from images pinned in infra/VERSIONS.md.
      - run: infra/helm/tests/assert.sh

  quickstart:
    name: Quickstart from a clean checkout (make env, make up)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The versions, so a failure in the steps below shows which Docker and Compose built it.
      - run: docker version && docker compose version
      # The whole local environment from nothing, as the README says, then restart, wipe, a taken
      # port and a failing migration (specs/006 FR-001 to FR-005, SC-001). It wipes the database,
      # which on a runner is a throwaway one.
      - run: scripts/ops/quickstart_check.sh
        env:
          QUICKSTART_THROWAWAY: "1"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans only the commits this run adds: a pull request's own commits, or a push's. A secret
      # anywhere in them fails the job, naming the file and line (specs/006 FR-025). The image is
      # pinned in infra/VERSIONS.md; .gitleaks.toml lists the made-up test values it may ignore.
      - name: gitleaks
        env:
          BASE: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch's push has an all-zero "before", and after a force-push "before" is no
          # longer in the history; then scan the pushed commit alone rather than fail on a bad range.
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            range="${BASE}..${HEAD_SHA}"
          else
            range="-1 ${HEAD_SHA}"
          fi
          echo "Scanning: $range"
          # Run as the checkout's owner, or git refuses the mounted repository as unsafe.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --verbose --log-opts="$range" .

  docstrings:
    name: Docstring coverage (interrogate, Constitution XI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run interrogate src/
        working-directory: apps/api

  markdown-links:
    name: Markdown link check (Constitution XI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Offline mode checks relative links and anchors only, so the job stays deterministic
      # and does not fail when a third-party site is down.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run pip-audit
        working-directory: apps/api

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  typecheck:
    name: Type check (mypy --strict, src and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run mypy --strict src/ tests/
        working-directory: apps/api

  import-graph:
    name: Import graph (Constitution II)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run python -m hds.tools.check_imports
        working-directory: apps/api

  test-unit:
    name: Unit and property tests (SQLite)
    runs-on: ubuntu-latest
    env:
      # The settings need an explicit environment and secret (specs/002-security-hardening).
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      # Examples per generation property (004 SC-002); 200 locally.
      HDS_GENERATE_EXAMPLES: "1000"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      # tests/property holds the Hypothesis tests of the scheduling package (Constitution IV).
      - run: uv run pytest tests/unit/ tests/property/ -v --tb=short
        working-directory: apps/api

  test-integration:
    name: Integration and contract tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: hds_test
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://hds:hds_test@localhost:5432/hds_test
      # The test suite reads TEST_DATABASE_URL (it must end in "_test"); without it the tests
      # fall back to a local-dev password that does not exist on this service.
      TEST_DATABASE_URL: postgresql+asyncpg://hds:hds_test@localhost:5432/hds_test
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      # Required once the settings stop defaulting to development (specs/002-security-hardening).
      ENVIRONMENT: test
      HDS_SCHEMATHESIS_EXAMPLES: "100"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      # tests/concurrency needs real parallelism on PostgreSQL, so it runs in this job; the
      # single-use and last-Admin guarantees would otherwise have no automated guard.
      - run: uv run pytest tests/integration/ tests/contract/ tests/concurrency/ -v --tb=short
        working-directory: apps/api

  migration-check:
    name: Migration check (alembic check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: hds_check
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_check
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://hds:hds_check@localhost:5432/hds_check
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run alembic check
        working-directory: apps/api

  contract:
    name: Contract tests (Schemathesis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: hds_scratch
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_scratch
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://hds:hds_scratch@localhost:5432/hds_scratch
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      ENVIRONMENT: test
      # The fuzzer fails sign-ins from one address on purpose; without this the second run in a
      # window could not even sign in.
      LOGIN_RATE_LIMIT_PER_NETWORK: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run python -m hds.scripts.seed_dev
        working-directory: apps/api
      - name: Start API
        run: |
          uv run uvicorn hds.main:app --host 0.0.0.0 --port 8000 &
          curl --retry 30 --retry-connrefused --retry-delay 1 -sf \
            http://localhost:8000/api/v1/openapi.json -o /dev/null
        working-directory: apps/api
      - name: OpenAPI drift check (T124)
        run: |
          curl -sf http://localhost:8000/api/v1/openapi.json -o /tmp/openapi.generated.json
          uv run python -m hds.scripts.export_openapi --check \
            ../../specs/001-foundation-auth-org/contracts/openapi.yaml /tmp/openapi.generated.json
        working-directory: apps/api
      - name: Schemathesis against the running, seeded server (T113)
        run: scripts/contract_cli.sh http://localhost:8000 50
        working-directory: apps/api

  client:
    name: Client (ESLint, tsc, Jest with coverage, generated-client drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile
      # Jest's compiled files; a warm cache keeps the first render of each test file fast.
      - uses: actions/cache@v4
        with:
          path: apps/client/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/client/jest.config.js') }}
      - run: pnpm client:lint
      - run: pnpm client:typecheck
      - run: pnpm client:test
      # Regenerates packages/api-client from the API's OpenAPI document and fails on any
      # difference from the committed copy (Constitution V).
      - run: pnpm api-client:check

  client-e2e:
    name: Client e2e (Playwright on the web build, with the RTL smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_DB: hds_e2e_test
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_e2e
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://hds:hds_e2e@localhost:5432/hds_e2e_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.5  # infra/VERSIONS.md
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/client
      - run: pnpm e2e
        working-directory: apps/client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/client/playwright-report/
