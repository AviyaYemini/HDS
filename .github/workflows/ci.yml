name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run ruff check src/ tests/
        working-directory: apps/api
      - run: uv run ruff format --check src/ tests/
        working-directory: apps/api

  docstrings:
    name: Docstring coverage (interrogate, Constitution XI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run interrogate src/
        working-directory: apps/api

  markdown-links:
    name: Markdown link check (Constitution XI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Offline mode checks relative links and anchors only, so the job stays deterministic
      # and does not fail when a third-party site is down.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments "**/*.md"
          fail: true

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run pip-audit
        working-directory: apps/api

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  typecheck:
    name: Type check (mypy --strict, src and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run mypy --strict src/ tests/
        working-directory: apps/api

  import-graph:
    name: Import graph (Constitution II)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run python -m hds.tools.check_imports
        working-directory: apps/api

  test-unit:
    name: Unit tests (SQLite)
    runs-on: ubuntu-latest
    env:
      # The settings need an explicit environment and secret (specs/002-security-hardening).
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run pytest tests/unit/ -v --tb=short
        working-directory: apps/api

  test-integration:
    name: Integration and contract tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hds_test
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://hds:hds_test@localhost:5432/hds_test
      # The test suite reads TEST_DATABASE_URL (it must end in "_test"); without it the tests
      # fall back to a local-dev password that does not exist on this service.
      TEST_DATABASE_URL: postgresql+asyncpg://hds:hds_test@localhost:5432/hds_test
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      # Required once the settings stop defaulting to development (specs/002-security-hardening).
      ENVIRONMENT: test
      HDS_SCHEMATHESIS_EXAMPLES: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      # tests/concurrency needs real parallelism on PostgreSQL, so it runs in this job; the
      # single-use and last-Admin guarantees would otherwise have no automated guard.
      - run: uv run pytest tests/integration/ tests/contract/ tests/concurrency/ -v --tb=short
        working-directory: apps/api

  migration-check:
    name: Migration check (alembic check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hds_check
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_check
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://hds:hds_check@localhost:5432/hds_check
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run alembic check
        working-directory: apps/api

  contract:
    name: Contract tests (Schemathesis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hds_scratch
          POSTGRES_USER: hds
          POSTGRES_PASSWORD: hds_scratch
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://hds:hds_scratch@localhost:5432/hds_scratch
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789
      ENVIRONMENT: test
      # The fuzzer fails sign-ins from one address on purpose; without this the second run in a
      # window could not even sign in.
      LOGIN_RATE_LIMIT_PER_NETWORK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run python -m hds.scripts.seed_dev
        working-directory: apps/api
      - name: Start API
        run: |
          uv run uvicorn hds.main:app --host 0.0.0.0 --port 8000 &
          curl --retry 30 --retry-connrefused --retry-delay 1 -sf \
            http://localhost:8000/api/v1/openapi.json -o /dev/null
        working-directory: apps/api
      - name: OpenAPI drift check (T124)
        run: |
          curl -sf http://localhost:8000/api/v1/openapi.json -o /tmp/openapi.generated.json
          uv run python -m hds.scripts.export_openapi --check \
            ../../specs/001-foundation-auth-org/contracts/openapi.yaml /tmp/openapi.generated.json
        working-directory: apps/api
      - name: Schemathesis against the running, seeded server (T113)
        run: scripts/contract_cli.sh http://localhost:8000 50
        working-directory: apps/api

  # TODO(T147): enable ts-client-check job in the apps/client feature (Constitution Principle V)
  # This job regenerates the TypeScript client from the OpenAPI spec and runs its tests.
  # It is SKIPPED until packages/api-client has a real generator configured.
